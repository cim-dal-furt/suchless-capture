<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121212" id="themeColorMeta">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="app-icon.png" type="image/png">
  <link rel="apple-touch-icon" href="app-icon.png">
  <title>SUCHLESS Capture Studio</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --surface: #ffffff;
      --surface-elevated: #f0f0ee;
      --border: #e2e2e0;
      --text: #1a1a19;
      --text-muted: #737370;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --success: #22c55e;
      --dot-color: rgba(0, 0, 0, 0.12);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body[data-theme="dark"] {
      --bg: #121212;
      --surface: #1e1e1e;
      --surface-elevated: #282828;
      --border: #333333;
      --text: #ececec;
      --text-muted: #8e8e8e;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --dot-color: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      transition: background-color 150ms ease, color 150ms ease;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      justify-content: space-between;
      position: relative;
    }

    /* Aceternity UI: Background with Dots Masked Vertical */
    .bg-dots-masked {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image: radial-gradient(var(--dot-color) 1.2px, transparent 1.2px);
      background-size: 20px 20px;
      -webkit-mask-image: linear-gradient(180deg, black 0%, black 35%, transparent 95%);
      mask-image: linear-gradient(180deg, black 0%, black 35%, transparent 95%);
      z-index: 0;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: calc(12px + env(safe-area-inset-top)) 16px 8px;
      z-index: 30;
      position: relative;
    }

    .mode-selector-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 120ms ease;
    }

    .mode-selector-btn:active { transform: scale(0.96); }

    .mode-selector-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 200ms ease;
    }

    .mode-selector-btn.open svg { transform: rotate(180deg); }

    .mode-menu {
      position: absolute;
      top: calc(100% + 4px);
      left: 16px;
      width: 190px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 2px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      z-index: 50;
      animation: popIn 150ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .mode-menu.open { display: flex; }

    .mode-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
    }

    .mode-item:active { background: var(--surface-elevated); }
    .mode-item.active { color: var(--primary); font-weight: 700; background: var(--surface-elevated); }
    .mode-item svg { width: 16px; height: 16px; stroke: var(--primary); fill: none; stroke-width: 2.5; display: none; }
    .mode-item.active svg { display: block; }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 120ms ease;
    }

    .icon-btn:active { transform: scale(0.92); }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .theme-toggle .moon-icon,
    body[data-theme="dark"] .theme-toggle .sun-icon { display: none; }
    body[data-theme="dark"] .theme-toggle .moon-icon { display: block; }

    .center-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex: 1;
      padding: 0 20px;
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    .glasses-logo {
      width: 90px;
      height: 52px;
      color: var(--primary);
    }

    .hero-title {
      font-size: 1.6rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .input-section {
      width: 100%;
      padding: 0 16px calc(16px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 20;
      position: relative;
    }

    .prompt-pill {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 12px;
      font-size: 0.78rem;
      line-height: 1.3;
      color: var(--text);
      cursor: pointer;
      transition: background 120ms ease, transform 100ms ease;
      user-select: none;
    }

    .prompt-pill:active { transform: scale(0.98); background: var(--surface-elevated); }
    .prompt-icon { color: var(--primary); flex-shrink: 0; font-size: 0.85rem; font-weight: 700; }
    .prompt-text { flex: 1; font-weight: 500; }

    .status-badge {
      align-self: center;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      transition: background 200ms ease;
    }

    .status-dot.busy { background: var(--primary); }
    .status-dot.recording { background: var(--primary); }
    .status-dot.error { background: var(--danger); }

    .floating-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 26px;
      display: flex;
      flex-direction: column;
      padding: 8px 12px;
      gap: 6px;
    }

    .thumbnails-row {
      display: none;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 2px;
      scrollbar-width: none;
    }

    .thumbnails-row::-webkit-scrollbar { display: none; }

    .thumb-item {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      position: relative;
      flex-shrink: 0;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }

    .thumb-del-btn {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border: none;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      min-height: 42px;
    }

    .action-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-muted);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 150ms ease, color 150ms ease, transform 100ms ease;
    }

    .action-btn:active { transform: scale(0.92); }

    .action-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .send-btn {
      background: var(--primary);
      color: #ffffff !important;
      border-radius: 50%;
    }

    .send-btn:active { transform: scale(0.92); filter: brightness(0.9); }

    textarea {
      flex: 1;
      min-height: 24px;
      max-height: 210px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.4;
      resize: none;
      padding: 8px 4px;
      overflow-y: hidden;
    }

    textarea::placeholder {
      color: var(--text-muted);
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .audio-recording-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 44px;
      padding: 0 4px;
    }

    .audio-cancel-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .audio-wave-wrap {
      display: flex;
      align-items: center;
      gap: 3px;
      flex: 1;
      justify-content: center;
    }

    .audio-timer {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--primary);
      margin-right: 8px;
      font-variant-numeric: tabular-nums;
    }

    .wave-bar {
      width: 3px;
      height: 12px;
      background: var(--primary);
      border-radius: 2px;
      animation: wave-pulse 1s ease-in-out infinite alternate;
    }

    .wave-bar:nth-child(2) { animation-delay: 0.15s; height: 18px; }
    .wave-bar:nth-child(3) { animation-delay: 0.3s; height: 24px; }
    .wave-bar:nth-child(4) { animation-delay: 0.45s; height: 14px; }
    .wave-bar:nth-child(5) { animation-delay: 0.6s; height: 8px; }

    .audio-confirm-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease;
    }

    .backdrop.open { opacity: 1; pointer-events: auto; }

    .bottom-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--surface);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      border-top: 1px solid var(--border);
      padding: 16px 20px calc(24px + env(safe-area-inset-bottom));
      z-index: 100;
      transform: translateY(100%);
      transition: transform 220ms cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .bottom-sheet.open { transform: translateY(0); }

    .sheet-handle {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      align-self: center;
      margin-bottom: 4px;
    }

    .sheet-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .sheet-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 16px;
      height: 84px;
      color: var(--text);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      transition: transform 120ms ease;
    }

    .sheet-btn:active { transform: scale(0.95); }
    .sheet-btn svg { width: 24px; height: 24px; stroke: var(--primary); fill: none; stroke-width: 2; }

    .hidden-input {
      display: none;
    }

    @keyframes wave-pulse { 0% { transform: scaleY(0.4); } 100% { transform: scaleY(1.4); } }
    @keyframes popIn { 0% { opacity: 0; transform: scale(0.92) translateY(-6px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="bg-dots-masked"></div>

    <header class="top-bar">
      <button id="modeSelectorBtn" class="mode-selector-btn" aria-haspopup="true" aria-expanded="false">
        <span id="currentModeLabel">Note / idea</span>
        <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>

      <div id="modeMenu" class="mode-menu" role="menu">
        <button class="mode-item active" data-mode="inbox" data-label="Note / idea">
          <span>Note / idea</span>
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </button>
        <button class="mode-item" data-mode="harvest" data-label="Daily log">
          <span>Daily log</span>
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </button>
        <button class="mode-item" data-mode="chronicle" data-label="Chronicle">
          <span>Chronicle</span>
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </button>
      </div>

      <button id="themeToggle" class="icon-btn theme-toggle" aria-label="Přepnout režim">
        <svg class="sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
        <svg class="moon-icon" viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a7 7 0 1 0 11 11z"></path></svg>
      </button>
    </header>

    <main class="center-hero">
      <svg class="glasses-logo" viewBox="0 0 130 65">
        <circle cx="30" cy="36" r="18" fill="none" stroke="currentColor" stroke-width="4.5"/>
        <path d="M 48 34 C 54 30, 62 30, 68 34" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="86" cy="36" r="18" fill="none" stroke="currentColor" stroke-width="4.5"/>
        <circle cx="86" cy="36" r="5.5" fill="currentColor"/>
        <path d="M 92 14 A 24 24 0 0 1 110 32" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 97 6 A 33 33 0 0 1 119 28" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 102 -2 A 42 42 0 0 1 128 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      <div class="hero-title" id="greetingText">S čím ti pomohu?</div>
    </main>

    <footer class="input-section">
      <div id="promptPill" class="prompt-pill" title="Klikni pro další otázku">
        <span class="prompt-icon">💡</span>
        <span id="promptText" class="prompt-text"></span>
      </div>

      <div class="status-badge">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">Připraveno</span>
      </div>

      <div class="floating-card">
        <div id="thumbRow" class="thumbnails-row"></div>

        <div id="standardInputRow" class="input-row">
          <button id="plusBtn" class="action-btn" aria-label="Přidat přílohu">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>

          <textarea id="txtInput" placeholder="Napiš myšlenku nebo úkol..." rows="1"></textarea>

          <button id="micBtn" class="action-btn" aria-label="Hlasová zpráva">
            <svg viewBox="0 0 24 24">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>

          <button id="sendBtn" class="action-btn send-btn" aria-label="Odeslat">
            <svg viewBox="0 0 24 24">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </div>

        <div id="audioRecordingRow" class="audio-recording-bar">
          <button id="audioCancelBtn" class="audio-cancel-btn" aria-label="Zrušit nahrávání">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>

          <div class="audio-wave-wrap">
            <span id="audioTimerText" class="audio-timer">00:00</span>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
          </div>

          <button id="audioConfirmBtn" class="audio-confirm-btn" aria-label="Potvrdit audio">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </button>
        </div>
      </div>
    </footer>
  </div>

  <div id="sheetBackdrop" class="backdrop"></div>
  <div id="bottomSheet" class="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-grid">
      <button id="cameraBtn" class="sheet-btn">
        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        Fotoaparát
      </button>
      <button id="photosBtn" class="sheet-btn">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        Fotky
      </button>
      <button id="filesBtn" class="sheet-btn">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        Soubory
      </button>
    </div>
  </div>

  <!-- Skryté inputy: Fotoaparát má přímé capture="environment" -->
  <input type="file" id="cameraInput" class="hidden-input" accept="image/*" capture="environment">
  <input type="file" id="photosInput" class="hidden-input" accept="image/*" multiple>
  <input type="file" id="filesInput" class="hidden-input" accept="*/*" multiple>

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');

    const modeSelectorBtn = document.getElementById('modeSelectorBtn');
    const currentModeLabel = document.getElementById('currentModeLabel');

    const themeToggleBtn = document.getElementById('themeToggle');
    const themeColorMeta = document.getElementById('themeColorMeta');

    const txtInput = document.getElementById('txtInput');
    const sendBtn = document.getElementById('sendBtn');

    const plusBtn = document.getElementById('plusBtn');
    const sheetBackdrop = document.getElementById('sheetBackdrop');
    const bottomSheet = document.getElementById('bottomSheet');
    const cameraBtn = document.getElementById('cameraBtn');
    const photosBtn = document.getElementById('photosBtn');
    const filesBtn = document.getElementById('filesBtn');
    const cameraInput = document.getElementById('cameraInput');
    const photosInput = document.getElementById('photosInput');

    const standardInputRow = document.getElementById('standardInputRow');

    let attachedFiles = [];

    let audioSeconds = 0;

    let currentMode = 'inbox';

    function getRandomPrompt() {
      const idx = Math.floor(Math.random() * MEMORY_PROMPTS.length);
      return MEMORY_PROMPTS[idx];
    }

    function setMode(modeValue, labelText) {
      currentMode = modeValue;
      currentModeLabel.innerText = labelText;

      modeItems.forEach(item => {
        if (item.dataset.mode === modeValue) item.classList.add('active');
        else item.classList.remove('active');
      });

      if (modeValue === 'chronicle') {
        promptText.innerText = getRandomPrompt();
        promptPill.style.display = 'flex';
      } else {
        promptPill.style.display = 'none';
      }
    }

    promptPill.addEventListener('click', () => {
      promptText.innerText = getRandomPrompt();
    });

    setMode('inbox', 'Note / idea');

    modeSelectorBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = modeMenu.classList.toggle('open');
      modeSelectorBtn.classList.toggle('open', isOpen);
    });

    modeItems.forEach(item => {
      item.addEventListener('click', () => {
        setMode(item.dataset.mode, item.dataset.label);
        modeMenu.classList.remove('open');
        modeSelectorBtn.classList.remove('open');
      });
    });

    document.addEventListener('click', (e) => {
      if (!modeSelectorBtn.contains(e.target) && !modeMenu.contains(e.target)) {
        modeMenu.classList.remove('open');
        modeSelectorBtn.classList.remove('open');
      }
    });

    function initGreeting() {
      const randomIndex = Math.floor(Math.random() * GREETINGS.length);
      greetingTextEl.innerText = GREETINGS[randomIndex];
    }
    initGreeting();

    let currentTheme = localStorage.getItem(THEME_KEY) || 'dark';
    function applyTheme(theme) {
      currentTheme = theme === 'dark' ? 'dark' : 'light';
      document.body.setAttribute('data-theme', currentTheme);
      localStorage.setItem(THEME_KEY, currentTheme);
      themeColorMeta.setAttribute('content', currentTheme === 'dark' ? '#121212' : '#f7f7f8');
    }
    applyTheme(currentTheme);
    themeToggleBtn.addEventListener('click', () => applyTheme(currentTheme === 'dark' ? 'light' : 'dark'));

    txtInput.addEventListener('input', () => {
      txtInput.style.height = 'auto';
      const scrollH = txtInput.scrollHeight;
      txtInput.style.height = Math.min(scrollH, 210) + 'px';
      txtInput.style.overflowY = scrollH > 210 ? 'auto' : 'hidden';
    });

    txtInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') e.stopPropagation();
    });

    function setStatus(msg, state = 'ready') {
      statusText.innerText = msg;
      statusDot.className = 'status-dot';
      if (state !== 'ready') statusDot.classList.add(state);
    }

    function openSheet() { sheetBackdrop.classList.add('open'); bottomSheet.classList.add('open'); }
    function closeSheet() { sheetBackdrop.classList.remove('open'); bottomSheet.classList.remove('open'); }

    plusBtn.addEventListener('click', openSheet);
    sheetBackdrop.addEventListener('click', closeSheet);

    cameraBtn.addEventListener('click', () => {
      closeSheet();
      cameraInput.click();
    });

    photosBtn.addEventListener('click', () => {
      closeSheet();
      photosInput.click();
    });

    filesBtn.addEventListener('click', () => {
      closeSheet();
      filesInput.click();
    });

    // Univerzální a robustní zpracování souborů přes FileReader
    function handleFileSelection(filesList, isCamera = false) {
      if (!filesList || filesList.length === 0) return;

      Array.from(filesList).forEach(file => {
        if (attachedFiles.length >= 5) {
          setStatus('Max 5 příloh', 'error');
          return;
        }

        const reader = new FileReader();
        reader.onload = function(evt) {
          const dataUrl = evt.target.result;
          if (!dataUrl) return;

          const base64 = dataUrl.indexOf(',') > -1 ? dataUrl.split(',')[1] : dataUrl;
          
          let fileName = file.name || '';
          if (!fileName || fileName === 'image.jpg' || isCamera) {
            fileName = `foto_${Date.now()}.jpg`;
          }

          // Pokud jde o kameru nebo soubor s obrázkovou příponou/typem
          const isImage = isCamera || (file.type && file.type.startsWith('image/')) || /\.(jpg|jpeg|png|webp|gif|heic)$/i.test(fileName);
          const mimeType = file.type || (isImage ? 'image/jpeg' : 'application/octet-stream');

          attachedFiles.push({
            fileName: fileName,
            mimeType: mimeType,
            base64: base64,
            previewUrl: isImage ? dataUrl : null
          });

          renderThumbnails();
          setStatus('Příloha přidána', 'ready');
        };

        reader.onerror = function() {
          setStatus('Chyba čtení souboru', 'error');
        };

        reader.readAsDataURL(file);
      });
    }

    cameraInput.addEventListener('change', function(e) {
      handleFileSelection(e.target.files, true);
      this.value = '';
    });

    photosInput.addEventListener('change', function(e) {
      handleFileSelection(e.target.files, false);
      this.value = '';
    });

    filesInput.addEventListener('change', function(e) {
      handleFileSelection(e.target.files, false);
      this.value = '';
    });

    function renderThumbnails() {
      thumbRow.innerHTML = '';
      if (attachedFiles.length === 0) {
        thumbRow.style.display = 'none';
        return;
      }

      thumbRow.style.display = 'flex';
      attachedFiles.forEach((f, idx) => {
        const div = document.createElement('div');
        div.className = 'thumb-item';

        if (f.previewUrl) {
          div.innerHTML = `<img src="${f.previewUrl}" alt="preview">`;
        } else {
          div.innerText = f.fileName.split('.').pop().toUpperCase();
        }

        const delBtn = document.createElement('button');
        delBtn.className = 'thumb-del-btn';
        delBtn.innerText = '✕';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          attachedFiles.splice(idx, 1);
          renderThumbnails();
        };

        div.appendChild(delBtn);
        thumbRow.appendChild(div);
      });
    }

    micBtn.addEventListener('click', startAudioRecording);
    audioCancelBtn.addEventListener('click', cancelAudioRecording);
    audioConfirmBtn.addEventListener('click', confirmAudioRecording);

    async function startAudioRecording() {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
        mediaRecorder = new MediaRecorder(micStream, { mimeType });
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };

        mediaRecorder.start();
        audioSeconds = 0;
        audioTimerText.innerText = '00:00';
        audioTimer = setInterval(() => {
          audioSeconds++;
          const m = String(Math.floor(audioSeconds / 60)).padStart(2, '0');
          const s = String(audioSeconds % 60).padStart(2, '0');
          audioTimerText.innerText = `${m}:${s}`;
        }, 1000);

        standardInputRow.style.display = 'none';
        audioRecordingRow.style.display = 'flex';
        setStatus('Nahrávám...', 'recording');

      } catch (err) {
        setStatus('Mikrofon nedostupný', 'error');
      }
    }

    function cancelAudioRecording() {
      stopMediaTracks();
      clearInterval(audioTimer);
      audioRecordingRow.style.display = 'none';
      standardInputRow.style.display = 'flex';
      setStatus('Nahrávání zrušeno', 'ready');
    }

    function confirmAudioRecording() {
      clearInterval(audioTimer);
      mediaRecorder.onstop = () => {
        const mimeType = mediaRecorder.mimeType || 'audio/webm';
        const webmBlob = new Blob(audioChunks, { type: mimeType });
        const fileName = `audio_${new Date().getTime()}.webm`;

        const reader = new FileReader();
        reader.onloadend = () => {
          const base64 = reader.result.split(',')[1];
          attachedFiles.push({
            fileName: fileName,
            mimeType: mimeType,
            base64: base64,
            previewUrl: null
          });
          renderThumbnails();
          setStatus('Audio připojeno', 'ready');
        };
        reader.readAsDataURL(webmBlob);
      };

      mediaRecorder.stop();
      stopMediaTracks();
      audioRecordingRow.style.display = 'none';
      standardInputRow.style.display = 'flex';
    }

    function stopMediaTracks() {
      if (micStream) micStream.getTracks().forEach(t => t.stop());
    }

    sendBtn.addEventListener('click', submitNote);

    function submitNote() {
      const textVal = txtInput.value.trim();
      if (!textVal && attachedFiles.length === 0) return;

      const payload = {
        token: PWA_SECRET_TOKEN,
        mode: currentMode,
        text: textVal,
        files: attachedFiles.map(f => ({
          fileName: f.fileName,
          mimeType: f.mimeType,
          base64: f.base64
        }))
      };

      txtInput.value = '';
      txtInput.style.height = 'auto';
      txtInput.style.overflowY = 'hidden';
      attachedFiles = [];
      renderThumbnails();
      setStatus('Uloženo', 'ready');

      if (currentMode === 'chronicle') {
        promptText.innerText = getRandomPrompt();
      }

      const body = JSON.stringify(payload);
      const options = { method: 'POST', body: body };
      if (body.length < 64000) options.keepalive = true;

      fetch(GAS_API_URL, options).catch(err => {
        console.error("Chyba přenosu:", err);
      });
    }
