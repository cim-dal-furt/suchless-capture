<!DOCTYPE html>
<html lang="cs">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <meta name="theme-color" content="#f5f8ff" id="themeColorMeta">
 <link rel="manifest" href="manifest.json">
 <link rel="icon" href="app-icon.svg" type="image/svg+xml">
 <title>SUCHLESS Capture</title>
 <style>
 :root {
 --bg: #f5f8ff;
 --bg-accent: #edf3ff;
 --card: #ffffff;
 --card-soft: #f8fbff;
 --border: #d8e6fb;
 --text: #1f314f;
 --text-soft: #657798;
 --muted: #8a9ab7;
 --primary: #0e5e89;
 --primary-strong: #094a6d;
 --primary-soft: #e9f3fb;
 --orange: #f29a2e;
 --success: #22c55e;
 --danger: #d63e3e;
 --warning: #d8922a;
 }

 * { box-sizing: border-box; margin: 0; padding: 0; }

 body {
 font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
 background:
 radial-gradient(120% 85% at 12% -10%, rgba(179, 214, 248, 0.45), transparent 62%),
 radial-gradient(110% 75% at 100% 5%, rgba(255, 233, 203, 0.45), transparent 62%),
 linear-gradient(180deg, #fafdff 0%, var(--bg) 55%, #eff4ff 100%);
 color: var(--text);
 height: 100dvh;
 overflow: hidden;
 display: grid;
 place-items: center;
 padding: 10px;
 }

 body[data-theme="dark"] {
 --bg: #151515;
 --bg-accent: #1d1d1d;
 --card: #202020;
 --card-soft: #282828;
 --border: #3b3b3b;
 --text: #f0f0f0;
 --text-soft: #b8b8b8;
 --muted: #8c8c8c;
 --primary: #d8d8d8;
 --primary-strong: #a8a8a8;
 --primary-soft: #2a2a2a;
 background:
 radial-gradient(120% 85% at 12% -10%, rgba(120, 120, 120, 0.28), transparent 62%),
 radial-gradient(110% 75% at 100% 5%, rgba(255, 255, 255, 0.08), transparent 62%),
 linear-gradient(180deg, #0f0f0f 0%, #151515 58%, #1c1c1c 100%);
 }

 .top-left-controls {
 position: absolute;
 top: calc(10px + env(safe-area-inset-top));
 left: 16px;
 display: inline-flex;
 align-items: center;
 gap: 8px;
 z-index: 20;
 }

 .close-overlay {
 position: absolute;
 top: calc(10px + env(safe-area-inset-top));
 right: 16px;
 width: 34px;
 height: 34px;
 border-radius: 50%;
 border: 1px solid var(--border);
 background: rgba(255, 255, 255, 0.9);
 cursor: pointer;
 z-index: 20;
 box-shadow: 0 8px 16px rgba(15, 66, 109, 0.14);
 }

 .close-overlay::after {
 content: "✕";
 position: absolute;
 inset: 0;
 display: grid;
 place-items: center;
 font-size: 0.9rem;
 color: #587293;
 font-weight: 700;
 }

 .help-chip {
 display: inline-flex;
 align-items: center;
 height: 34px;
 padding: 8px 11px;
 border-radius: 999px;
 border: 1px solid #d9e0ea;
 background: rgba(242, 245, 249, 0.96);
 color: #8a95a8;
 font-size: 0.72rem;
 font-weight: 700;
 letter-spacing: 0.03em;
 white-space: nowrap;
 box-shadow: 0 8px 16px rgba(49, 65, 89, 0.08);
 pointer-events: none;
 user-select: none;
 }

 .theme-toggle {
 width: 34px;
 height: 34px;
 border-radius: 50%;
 border: 1px solid var(--border);
 background: rgba(255, 255, 255, 0.9);
 color: #587293;
 display: inline-grid;
 place-items: center;
 cursor: pointer;
 box-shadow: 0 8px 16px rgba(15, 66, 109, 0.14);
 transition: transform 120ms ease, background-color 160ms ease, color 160ms ease, border-color 160ms ease;
 }

 .theme-toggle:active {
 transform: scale(0.96);
 }

 .theme-toggle svg {
 width: 18px;
 height: 18px;
 stroke: currentColor;
 fill: none;
 stroke-width: 2;
 stroke-linecap: round;
 stroke-linejoin: round;
 }

 .theme-toggle .moon-icon,
 body[data-theme="dark"] .theme-toggle .sun-icon {
 display: none;
 }

 body[data-theme="dark"] .theme-toggle .moon-icon {
 display: block;
 }

 body[data-theme="dark"] .close-overlay,
 body[data-theme="dark"] .theme-toggle {
 background: linear-gradient(180deg, #2b2b2b 0%, #202020 100%);
 color: #e1e1e1;
 border-color: #424242;
 box-shadow:
 0 8px 16px rgba(0, 0, 0, 0.18),
 inset 0 1px 0 rgba(255, 255, 255, 0.08);
 }

 body[data-theme="dark"] .help-chip {
 background: rgba(42, 42, 42, 0.96);
 color: #a8a8a8;
 border-color: #454545;
 }

 .app-shell {
 width: min(100%, 430px);
 height: min(100dvh, 900px);
 background: linear-gradient(180deg, #ffffff 0%, #f4f8ff 100%);
 border-radius: 36px;
 border: 1px solid rgba(179, 202, 235, 0.6);
 box-shadow:
 0 26px 60px rgba(12, 56, 97, 0.2),
 inset 0 1px 0 rgba(255, 255, 255, 0.9);
 overflow: hidden;
 position: relative;
 display: flex;
 flex-direction: column;
 }

 body[data-theme="dark"] .app-shell {
 background: linear-gradient(180deg, #202020 0%, #171717 100%);
 border-color: rgba(86, 86, 86, 0.65);
 box-shadow:
 0 26px 60px rgba(0, 0, 0, 0.32),
 inset 0 1px 0 rgba(255, 255, 255, 0.06);
 }

 .app-main {
 padding: calc(64px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
 display: flex;
 flex-direction: column;
 gap: 12px;
 min-height: 100%;
 }

 .sheet-hero {
 padding: 18px 14px;
 min-height: 160px;
 position: relative;
 overflow: hidden;
 background:
 radial-gradient(130% 90% at 6% 2%, rgba(185, 217, 248, 0.55), transparent 62%),
 radial-gradient(90% 80% at 95% 0%, rgba(255, 223, 187, 0.6), transparent 62%),
 linear-gradient(155deg, #ffffff 0%, #f2f8ff 100%);
 border: 1px solid var(--border);
 border-radius: 24px;
 }

 body[data-theme="dark"] .sheet-hero {
 background:
 radial-gradient(130% 90% at 6% 2%, rgba(120, 120, 120, 0.22), transparent 62%),
 radial-gradient(90% 80% at 95% 0%, rgba(255, 255, 255, 0.08), transparent 62%),
 linear-gradient(155deg, #242424 0%, #191919 100%);
 }

 .hero-main {
 display: flex;
 justify-content: space-between;
 align-items: flex-start;
 gap: 14px;
 }

 .hero-title {
 font-size: 1.32rem;
 line-height: 1.2;
 color: #1f4c71;
 font-weight: 800;
 max-width: 270px;
 }

 .hero-title-small {
 font-size: 0.86em;
 font-weight: 700;
 }

 .hero-sub {
 margin-top: 14px;
 font-size: 0.78rem;
 color: var(--text-soft);
 font-weight: 600;
 }

 .hero-orb {
 height: 0;
 margin: 0;
 overflow: visible;
 display: grid;
 place-items: center;
 }

 .hero-orb-core {
 width: 58px;
 height: 58px;
 border-radius: 50%;
 background:
 radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.12) 42%, transparent 62%),
 radial-gradient(circle at 70% 70%, rgba(49, 143, 203, 0.46), rgba(27, 105, 155, 0.2));
 border: 1px solid rgba(255, 255, 255, 0.8);
 box-shadow:
 0 10px 26px rgba(27, 105, 155, 0.24),
 inset 0 -6px 12px rgba(15, 72, 111, 0.25);
 animation: glowPulse 3.8s ease-in-out infinite;
 }

 .status-chip {
 display: inline-flex;
 align-items: center;
 padding: 8px 11px;
 border-radius: 999px;
 border: 1px solid #cbe0fb;
 background: rgba(255, 255, 255, 0.92);
 color: #2f5f86;
 font-size: 0.72rem;
 font-weight: 700;
 letter-spacing: 0.03em;
 white-space: nowrap;
 box-shadow: 0 8px 16px rgba(26, 84, 129, 0.12);
 }

 .status-chip.ready { color: #2f5f86; }
 .status-chip.busy { color: #27537a; }
 .status-chip.recording { color: #b53d3d; border-color: #f3cccc; }
 .status-chip.queued { color: #af7a1e; border-color: #f5deb8; }
 .status-chip.success { color: #1f8d53; border-color: #c5efd8; }
 .status-chip.error { color: #b53d3d; border-color: #f3cccc; }

 body[data-theme="dark"] .status-chip {
 background: rgba(38, 38, 38, 0.94);
 color: #dedede;
 border-color: #4a4a4a;
 box-shadow:
 0 8px 16px rgba(0, 0, 0, 0.16),
 inset 0 1px 0 rgba(255, 255, 255, 0.07);
 }

 .status-line {
 height: 4px;
 border-radius: 999px;
 background: #e6eefb;
 overflow: hidden;
 position: relative;
 margin-top: 8px;
 }

 .status-line::after {
 content: "";
 display: block;
 height: 100%;
 width: 0;
 border-radius: inherit;
 background: transparent;
 transition: width 220ms ease, background-color 220ms ease;
 }

 body[data-state="busy"] .status-line::after {
 width: 30%;
 animation: indeterminate 1.35s linear infinite;
 }

 body[data-state="recording"] .status-line::after {
 width: 70%;
 background: linear-gradient(90deg, #f2994a, #d7633f);
 animation: breathe 1.1s ease-in-out infinite;
 }

 body[data-state="success"] .status-line::after {
 width: 100%;
 background: linear-gradient(90deg, #5ccf8a, #2aa864);
 }

 body[data-state="error"] .status-line::after {
 width: 100%;
 background: linear-gradient(90deg, #eb8d8d, #d84f4f);
 }

 body[data-state="queued"] .status-line::after {
 width: 100%;
 background: linear-gradient(90deg, #f3c36f, #e39a38);
 }

 .info-pill {
 display: inline-flex;
 align-items: center;
 justify-content: center;
 border-radius: 999px;
 border: 1px solid var(--border);
 background: #ffffff;
 color: #43698f;
 font-weight: 500;
 font-size: 0.76rem;
 font-style: italic;
 line-height: 1.35;
 text-align: center;
 padding: 10px 14px;
 box-shadow: 0 8px 16px rgba(31, 84, 133, 0.08);
 }

 body[data-theme="dark"] .info-pill {
 background: #242424;
 color: #d0d0d0;
 box-shadow: 0 8px 16px rgba(0, 0, 0, 0.18);
 }

 .overview-grid {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 10px;
 }

 .mini-card {
 border-radius: 16px;
 border: 1px solid #e1ecfb;
 padding: 12px;
 background: linear-gradient(150deg, #ffffff 0%, #f6faff 100%);
 box-shadow: 0 10px 18px rgba(31, 84, 133, 0.08);
 }

 body[data-theme="dark"] .mini-card {
 background: linear-gradient(150deg, #232323 0%, #292929 100%);
 border-color: #3d3d3d;
 box-shadow: 0 10px 18px rgba(0, 0, 0, 0.2);
 }

 body[data-theme="dark"] .mini-card h3,
 body[data-theme="dark"] .hero-title {
 color: #eeeeee;
 }

 .mini-card h3 {
 color: #274a70;
 font-size: 0.94rem;
 margin-bottom: 2px;
 }

 .mini-card p {
 color: var(--text-soft);
 font-size: 0.78rem;
 }

 .sheet-content {
 display: flex;
 flex-direction: column;
 gap: 10px;
 border: 1px solid var(--border);
 border-radius: 20px;
 background: var(--card);
 padding: 12px;
 box-shadow: 0 14px 22px rgba(27, 83, 132, 0.1);
 position: relative;
 }

 body[data-theme="dark"] .sheet-content {
 box-shadow: 0 14px 22px rgba(0, 0, 0, 0.24);
 }

 .shine-border {
 position: relative;
 border-radius: 18px;
 padding: 1px;
 overflow: hidden;
 background: linear-gradient(120deg, rgba(143, 192, 231, 0.2), rgba(242, 154, 46, 0.26), rgba(143, 192, 231, 0.2));
 }

 .shine-border::before {
 content: "";
 position: absolute;
 inset: -120%;
 background: conic-gradient(from 0deg, transparent 0deg, transparent 80deg, rgba(255, 255, 255, 0.95) 115deg, rgba(143, 192, 231, 0.72) 145deg, transparent 185deg, transparent 360deg);
 animation: shineSpin 4.8s linear infinite;
 }

 .shine-border textarea {
 position: relative;
 z-index: 1;
 display: block;
 }

 body[data-theme="dark"] .shine-border {
 background: linear-gradient(120deg, rgba(80, 148, 190, 0.34), rgba(242, 154, 46, 0.28), rgba(80, 148, 190, 0.34));
 }

 body[data-theme="dark"] .shine-border::before {
 background: conic-gradient(from 0deg, transparent 0deg, transparent 82deg, rgba(255, 255, 255, 0.82) 112deg, rgba(96, 174, 223, 0.66) 142deg, rgba(242, 154, 46, 0.5) 168deg, transparent 205deg, transparent 360deg);
 }

 textarea {
 width: 100%;
 min-height: 120px;
 background: var(--card-soft);
 border: 1px solid #d8e7fa;
 border-radius: 16px;
 color: #213a5b;
 font-family: "Aptos", "Segoe UI Variable Text", "Segoe UI", sans-serif;
 padding: 14px;
 font-size: 0.97rem;
 line-height: 1.4;
 resize: none;
 outline: none;
 transition: border-color 180ms ease, box-shadow 180ms ease;
 }

 textarea::placeholder {
 color: #8da1bf;
 font-family: "Aptos", "Segoe UI Variable Text", "Segoe UI", sans-serif;
 font-weight: 500;
 opacity: 1;
 }

 body[data-theme="dark"] textarea::placeholder {
 color: #8f8f8f;
 }

 textarea:focus {
 border-color: #8fc0e7;
 box-shadow:
 0 0 0 4px rgba(143, 192, 231, 0.26);
 }

 .hidden-file-input {
 display: none;
 }

 .btn {
 display: inline-flex;
 align-items: center;
 justify-content: center;
 gap: 8px;
 width: 100%;
 min-height: 44px;
 padding: 10px 12px;
 border-radius: 14px;
 border: 1px solid var(--border);
 color: #36587e;
 font-size: 0.85rem;
 font-weight: 600;
 letter-spacing: 0.015em;
 cursor: pointer;
 transition: transform 120ms ease, filter 120ms ease, border-color 120ms ease, background-color 120ms ease;
 box-shadow: 0 10px 14px rgba(31, 84, 133, 0.08);
 background: #ffffff;
 }

 body[data-theme="dark"] .btn {
 background: linear-gradient(180deg, #2a2a2a 0%, #222222 100%);
 color: #e2e2e2;
 border-color: #424242;
 box-shadow:
 0 10px 14px rgba(0, 0, 0, 0.15),
 inset 0 1px 0 rgba(255, 255, 255, 0.08);
 }

 .btn .btn-icon {
 width: 16px;
 height: 16px;
 display: inline-flex;
 align-items: center;
 justify-content: center;
 color: currentColor;
 opacity: 0.95;
 flex: 0 0 auto;
 }

 .btn .btn-icon svg {
 width: 16px;
 height: 16px;
 stroke: currentColor;
 fill: none;
 stroke-width: 1.9;
 stroke-linecap: round;
 stroke-linejoin: round;
 }

 .btn:active {
 transform: scale(0.985);
 filter: brightness(0.96);
 }

 .btn-primary {
 background: linear-gradient(165deg, var(--primary), var(--primary-strong));
 border-color: #206b98;
 color: #f3f9ff;
 box-shadow:
 0 14px 24px rgba(14, 94, 137, 0.3),
 inset 0 1px 0 rgba(255, 255, 255, 0.26);
 }

 .btn-secondary {
 background: #ffffff;
 border-color: #d9e8fb;
 color: #42698f;
 }

 .btn-alert {
 background: linear-gradient(170deg, #0f5d88, #0a4768);
 border-color: #216d9b;
 color: #f2f8ff;
 }

 .btn-neutral {
 background: linear-gradient(160deg, #fffaf3, #fff5e8);
 border-color: #f7dec0;
 color: #9d6b24;
 }

 body[data-theme="dark"] .btn-primary,
 body[data-theme="dark"] .btn-alert {
 background: linear-gradient(180deg, #2d4658 0%, #253846 100%);
 border-color: #486a82;
 color: #eef8ff;
 box-shadow:
 0 12px 20px rgba(0, 0, 0, 0.18),
 inset 0 1px 0 rgba(255, 255, 255, 0.12);
 }

 body[data-theme="dark"] .btn-secondary {
 background: linear-gradient(180deg, #2c2c2c 0%, #232323 100%);
 border-color: #464646;
 color: #dddddd;
 }

 body[data-theme="dark"] .btn-neutral {
 background: linear-gradient(180deg, #3e3528 0%, #30291f 100%);
 border-color: #6b5535;
 color: #f3d8a7;
 }

 .btn.rec {
 background: linear-gradient(165deg, #ca5b4a, #b34134);
 border-color: #de8f84;
 animation: pulse 1.1s ease-in-out infinite;
 }

 .grid {
 display: grid;
 grid-template-columns: 1fr auto 1fr;
 gap: 10px;
 align-items: center;
 }

 #recBtn {
 width: 76px;
 min-width: 76px;
 min-height: 76px;
 border-radius: 999px;
 padding: 0;
 gap: 0;
 position: relative;
 top: -4px;
 }

 #recBtn .btn-icon {
 width: 22px;
 height: 22px;
 }

 #recBtn .btn-icon svg {
 width: 22px;
 height: 22px;
 }

 #recBtn .btn-text {
 display: none;
 }

 .capture-btn {
 min-height: 44px;
 font-size: 0.85rem;
 }

 .meta-row {
 margin-top: 2px;
 display: flex;
 justify-content: space-between;
 align-items: center;
 gap: 10px;
 color: var(--text-soft);
 font-size: 0.76rem;
 }

 .toggle {
 display: inline-flex;
 align-items: center;
 gap: 8px;
 cursor: pointer;
 }

 .toggle input {
 accent-color: #2e89c0;
 width: 15px;
 height: 15px;
 }

 #status {
 color: #547095;
 font-size: 0.79rem;
 min-height: 18px;
 }

 #queueInfo {
 color: #6f88aa;
 font-size: 0.76rem;
 }

 @keyframes pulse {
 0%, 100% { opacity: 1; }
 50% { opacity: 0.74; }
 }

 @keyframes breathe {
 0%, 100% { opacity: 1; }
 50% { opacity: 0.55; }
 }

 @keyframes indeterminate {
 0% { transform: translateX(-110%); }
 100% { transform: translateX(330%); }
 }

 @keyframes glowPulse {
 0%, 100% { transform: scale(1); }
 50% { transform: scale(1.04); }
 }

 @keyframes shineSpin {
 to { transform: rotate(360deg); }
 }

 @media (max-width: 460px) {
 body {
 padding: 0;
 }

 .app-shell {
 width: 100%;
 height: 100dvh;
 border-radius: 0;
 border: none;
 box-shadow: none;
 }
 }

 @media (max-width: 390px) {
 .hero-sub {
 font-size: 1.18rem;
 }

 .sheet-content {
 padding: 10px;
 }

 .btn {
 font-size: 0.8rem;
 }
 }
 </style>
</head>
<body>
 <div class="app-shell">
 <div class="top-left-controls">
 <button id="themeToggle" class="theme-toggle" type="button" aria-label="Přepnout tmavý režim">
 <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
 <circle cx="12" cy="12" r="4"></circle>
 <path d="M12 2v2"></path>
 <path d="M12 20v2"></path>
 <path d="M4.93 4.93l1.41 1.41"></path>
 <path d="M17.66 17.66l1.41 1.41"></path>
 <path d="M2 12h2"></path>
 <path d="M20 12h2"></path>
 <path d="M4.93 19.07l1.41-1.41"></path>
 <path d="M17.66 6.34l1.41-1.41"></path>
 </svg>
 <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
 <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a7 7 0 1 0 11 11z"></path>
 </svg>
 </button>
 <div class="help-chip" aria-disabled="true">Nápověda</div>
 </div>
 <div id="closeBtn" class="close-overlay" aria-label="Zavřít aplikaci"></div>

 <div class="app-main">
 <div class="sheet-hero">
 <div class="hero-main">
 <div>
 <div class="hero-title">SUCHLESS <span class="hero-title-small">Capture Studio</span></div>
 <div class="hero-sub">Rychle zachyť nápad dřív, než zmizí.</div>
 </div>
 <div id="statusChip" class="status-chip ready">Připraveno</div>
 </div>
 <div class="hero-orb" aria-hidden="true">
 <div class="hero-orb-core"></div>
 </div>
 </div>

 <div class="info-pill">Pracuj s poznámkami, hlasem<br>i soubory na jednom místě</div>

 <div class="overview-grid" aria-hidden="true">
 <div class="mini-card">
 <h3>Poznámky</h3>
 <p>Rychlé textové zachycení myšlenek.</p>
 </div>
 <div class="mini-card">
 <h3>Hlas a média</h3>
 <p>Nahrávky, fotky a soubory během pár sekund.</p>
 </div>
 </div>

 <div class="sheet-content">
 <div class="shine-border">
 <textarea id="txt" placeholder="Napiš nápad, úkol nebo stručnou poznámku..."></textarea>
 </div>

 <div class="grid">
 <button id="camBtn" class="btn btn-secondary">
 <span class="btn-icon" aria-hidden="true">
 <svg viewBox="0 0 24 24">
 <path d="M4 8h4l2-2h4l2 2h4v10H4z"></path>
 <circle cx="12" cy="13" r="3"></circle>
 </svg>
 </span>
 <span>Fotoaparát</span>
 </button>
 <input type="file" id="cam" class="hidden-file-input" accept="image/*" capture="environment">

 <button id="recBtn" class="btn btn-alert">
 <span class="btn-icon" aria-hidden="true">
 <svg viewBox="0 0 24 24">
 <rect x="9" y="3" width="6" height="11" rx="3"></rect>
 <path d="M5 11a7 7 0 0 0 14 0"></path>
 <path d="M12 18v3"></path>
 </svg>
 </span>
 <span class="btn-text">Hlasová poznámka</span>
 </button>

 <button id="fileBtn" class="btn btn-neutral">
 <span class="btn-icon" aria-hidden="true">
 <svg viewBox="0 0 24 24">
 <path d="M12 16V5"></path>
 <path d="M8 9l4-4 4 4"></path>
 <path d="M4 16v3h16v-3"></path>
 </svg>
 </span>
 <span>Soubor</span>
 </button>
 <input type="file" id="file" class="hidden-file-input" accept="*/*">
 </div>

 <button id="saveBtn" class="btn btn-primary capture-btn">
 <span class="btn-icon" aria-hidden="true">
 <svg viewBox="0 0 24 24">
 <path d="M12 20h9"></path>
 <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path>
 </svg>
 </span>
 <span>Uložit poznámku</span>
 </button>

 <div class="meta-row">
 <label class="toggle">
 <input type="checkbox" id="closeAfterSend" checked>
 Zavřít po odeslání
 </label>
 <span id="queueInfo">Fronta požadavků: 0</span>
 </div>

 <div id="status">Připraveno</div>
 <div class="status-line"></div>
 </div>
 </div>
 </div>

 <script>
 const GAS_API_URL = "https://script.google.com/macros/s/AKfycby1wPlRee-lSHkxAD1DyFTHHRFg9_aXogjOpCyzEsb88SaY6XdJEdNNsWEw…;
 const PWA_SECRET_TOKEN = "FordFocus.1816v";
 const QUEUE_KEY = "suchlessCaptureQueueV1";
 const CLOSE_AFTER_SEND_KEY = "suchlessCloseAfterSendV1";
 const THEME_KEY = "suchlessCaptureThemeV1";

 if ('serviceWorker' in navigator) {
 navigator.serviceWorker.register('./sw.js');
 }

 const statusEl = document.getElementById('status');
 const statusChipEl = document.getElementById('statusChip');
 const queueInfoEl = document.getElementById('queueInfo');
 const closeAfterSendEl = document.getElementById('closeAfterSend');
 const themeToggleEl = document.getElementById('themeToggle');
 const themeColorMetaEl = document.getElementById('themeColorMeta');
 const closeBtnEl = document.getElementById('closeBtn');
 const camBtnEl = document.getElementById('camBtn');
 const camInputEl = document.getElementById('cam');
 const recBtnEl = document.getElementById('recBtn');
 const fileBtnEl = document.getElementById('fileBtn');
 const fileInputEl = document.getElementById('file');
 const saveBtnEl = document.getElementById('saveBtn');

 let isRec = false;
 let audioTimer = null, audioSeconds = 0;
 let mediaRecorder = null;
 let audioChunks = [];
 let micStream = null;
 let closeAfterSend = localStorage.getItem(CLOSE_AFTER_SEND_KEY) !== '0';
 let currentTheme = localStorage.getItem(THEME_KEY) || 'light';

 function applyTheme(theme) {
 currentTheme = theme === 'dark' ? 'dark' : 'light';
 document.body.setAttribute('data-theme', currentTheme);
 localStorage.setItem(THEME_KEY, currentTheme);
 themeToggleEl.setAttribute(
 'aria-label',
 currentTheme === 'dark' ? 'Přepnout světlý režim' : 'Přepnout tmavý režim'
 );
 themeColorMetaEl.setAttribute('content', currentTheme === 'dark' ? '#151515' : '#f5f8ff');
 }

 applyTheme(currentTheme);

 closeAfterSendEl.checked = closeAfterSend;
 closeAfterSendEl.addEventListener('change', () => {
 closeAfterSend = closeAfterSendEl.checked;
 localStorage.setItem(CLOSE_AFTER_SEND_KEY, closeAfterSend ? '1' : '0');
 });

 themeToggleEl.addEventListener('click', () => {
 applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
 });

 closeBtnEl.addEventListener('click', requestCloseApp);
 camBtnEl.addEventListener('click', () => camInputEl.click());
 camInputEl.addEventListener('change', () => sendCameraPhoto(camInputEl.files[0]));
 recBtnEl.addEventListener('click', toggleAudio);
 fileBtnEl.addEventListener('click', () => fileInputEl.click());
 fileInputEl.addEventListener('change', () => sendFile(fileInputEl.files[0]));
 saveBtnEl.addEventListener('click', sendText);

 function setStatus(msg, state = 'ready') {
 statusEl.innerText = msg;
 document.body.setAttribute('data-state', state);
 statusChipEl.className = `status-chip ${state}`;

 if (state === 'recording') statusChipEl.innerText = 'Nahrávání';
 if (state === 'busy') statusChipEl.innerText = 'Ukládám';
 if (state === 'queued') statusChipEl.innerText = 'Offline fronta';
 if (state === 'success') statusChipEl.innerText = 'Hotovo';
 if (state === 'error') statusChipEl.innerText = 'Chyba';
 if (state === 'ready') statusChipEl.innerText = 'Připraveno';
 }

 function getQueue() {
 try {
 return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
 } catch {
 return [];
 }
 }

 function setQueue(queue) {
 localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
 updateQueueInfo();
 }

 function updateQueueInfo() {
 const count = getQueue().length;
 queueInfoEl.innerText = `Fronta požadavků: ${count}`;
 }

 function enqueuePayload(payload) {
 const queue = getQueue();
 queue.push(payload);
 setQueue(queue);
 }

 function formatTime(sec) {
 const m = Math.floor(sec / 60).toString().padStart(2, '0');
 const s = (sec % 60).toString().padStart(2, '0');
 return `${m}:${s}`;
 }

 function getFormattedDateTime() {
 const now = new Date();
 const day = String(now.getDate()).padStart(2, '0');
 const month = String(now.getMonth() + 1).padStart(2, '0');
 const year = now.getFullYear();
 const hours = String(now.getHours()).padStart(2, '0');
 const minutes = String(now.getMinutes()).padStart(2, '0');
 const seconds = String(now.getSeconds()).padStart(2, '0');
 return `${day}_${month}_${year}_${hours}${minutes}${seconds}`;
 }

 async function sendPayload(payload) {
 const response = await fetch(GAS_API_URL, {
 method: 'POST',
 body: JSON.stringify(payload)
 });

 if (!response.ok) {
 throw new Error('Network response error');
 }

 return response.json();
 }

 async function flushQueue() {
 if (!navigator.onLine) {
 if (getQueue().length > 0) {
 setStatus('Offline režim: čekám na připojení', 'queued');
 }
 return;
 }

 const queue = getQueue();
 if (queue.length === 0) return;

 setStatus(`Synchronizuji frontu (${queue.length})...`, 'busy');
 let remaining = [...queue];
 let sentCount = 0;

 while (remaining.length > 0) {
 const nextPayload = remaining[0];
 try {
 await sendPayload(nextPayload);
 sentCount++;
 remaining.shift();
 setQueue(remaining);
 } catch {
 break;
 }
 }

 if (sentCount > 0) {
 setStatus(`Synchronizováno položek: ${sentCount}`, 'success');
 setTimeout(() => {
 if (!isRec) setStatus('Připraveno', 'ready');
 }, 1000);
 } else if (remaining.length > 0) {
 setStatus('Čekám na stabilní připojení k internetu', 'queued');
 }
 }

 function onUploadSuccess(message) {
 setStatus(message || 'Uloženo', 'success');
 setTimeout(() => {
 if (closeAfterSend) {
 requestCloseApp();
 return;
 }
 if (!isRec) setStatus('Připraveno', 'ready');
 }, 900);
 }

 function requestCloseApp() {
 // Prefer native close where allowed, fallback to back navigation for Android/PWA contexts.
 window.close();

 setTimeout(() => {
 if (document.hidden) return;

 if (window.history.length > 1) {
 window.history.back();
 return;
 }

 window.location.href = 'about:blank';
 }, 120);
 }

 function queueForLater(payload) {
 enqueuePayload(payload);
 setStatus('Bez připojení: uloženo do fronty', 'queued');
 }

 function sendText() {
 const val = document.getElementById('txt').value.trim();
 if (!val) return;
 setStatus('Ukládám poznámku...', 'busy');
 const blob = new Blob([val], { type: 'text/markdown' });
 const fileName = `text_${getFormattedDateTime()}.md`;
 postData(blob, fileName, 'text/markdown');
 document.getElementById('txt').value = '';
 }

 function setRecButtonLabel(text) {
 const btn = document.getElementById('recBtn');
 btn.querySelector('.btn-text').textContent = text;
 }

 async function toggleAudio() {
 const btn = document.getElementById('recBtn');

 if (!isRec) {
 try {
 micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
 const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
 ? 'audio/webm;codecs=opus'
 : 'audio/webm';

 mediaRecorder = new MediaRecorder(micStream, { mimeType });
 audioChunks = [];

 mediaRecorder.ondataavailable = (e) => {
 if (e.data.size > 0) audioChunks.push(e.data);
 };

 mediaRecorder.onstop = () => {
 const webmBlob = new Blob(audioChunks, { type: mimeType });
 const fileName = `audio_${getFormattedDateTime()}.webm`;
 postData(webmBlob, fileName, mimeType);
 };

 mediaRecorder.start();
 isRec = true;
 audioSeconds = 0;
 setRecButtonLabel('Nahrávání');
 btn.classList.add('rec');
 setStatus('Nahrávání • 00:00', 'recording');

 audioTimer = setInterval(() => {
 audioSeconds++;
 const formatted = formatTime(audioSeconds);
 setStatus(`Nahrávání • ${formatted}`, 'recording');
 }, 1000);
 } catch (err) {
 setStatus('Mikrofon není dostupný', 'error');
 }
 } else {
 isRec = false;
 clearInterval(audioTimer);
 mediaRecorder.stop();
 if (micStream) micStream.getTracks().forEach((t) => t.stop());
 setRecButtonLabel('Hlasová poznámka');
 btn.classList.remove('rec');
 setStatus('Zpracovávám záznam...', 'busy');
 }
 }

 function sendCameraPhoto(f) {
 if (!f) return;
 setStatus('Nahrávám fotografii...', 'busy');
 const fileName = f.name ? f.name : `photo_${getFormattedDateTime()}.jpg`;
 postData(f, fileName, 'image/jpeg');
 }

 function sendFile(f) {
 if (!f) return;
 setStatus('Nahrávám soubor...', 'busy');
 postData(f, f.name, f.type || 'application/octet-stream');
 }

 function postData(blob, fileName, mimeType) {
 const reader = new FileReader();
 reader.onloadend = async function () {
 const base64 = reader.result.split(',')[1];
 const payload = {
 token: PWA_SECRET_TOKEN,
 base64,
 fileName,
 mimeType
 };

 try {
 const data = await sendPayload(payload);
 onUploadSuccess(data && data.message ? data.message : 'Uloženo');
 flushQueue();
 } catch {
 queueForLater(payload);
 }
 };
 reader.readAsDataURL(blob);
 }

 window.addEventListener('online', flushQueue);
 window.addEventListener('load', () => {
 updateQueueInfo();
 setStatus('Připraveno', 'ready');
 flushQueue();
 });
 </script>
</body>
</html>
