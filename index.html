<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#f5f8ff" id="themeColorMeta">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="app-icon.svg" type="image/svg+xml">
  <title>SUCHLESS Capture</title>
  <style>
    :root {
      --bg: #f5f8ff;
      --bg-accent: #edf3ff;
      --card: #ffffff;
      --card-soft: #f8fbff;
      --border: #d8e6fb;
      --text: #1f314f;
      --text-soft: #657798;
      --muted: #8a9ab7;
      --primary: #0e5e89;
      --primary-strong: #094a6d;
      --primary-soft: #e9f3fb;
      --orange: #f29a2e;
      --orange-soft: #fff7ed;
      --orange-border: #fde68a;
      --orange-text: #b45309;
      --blue-soft: #e0f2fe;
      --blue-border: #bae6fd;
      --blue-text: #0369a1;
      --success: #22c55e;
      --danger: #d63e3e;
      --warning: #d8922a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background:
        radial-gradient(120% 85% at 12% -10%, rgba(179, 214, 248, 0.45), transparent 62%),
        radial-gradient(110% 75% at 100% 5%, rgba(255, 233, 203, 0.45), transparent 62%),
        linear-gradient(180deg, #fafdff 0%, var(--bg) 55%, #eff4ff 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    body[data-theme="dark"] {
      --bg: #151515;
      --bg-accent: #1d1d1d;
      --card: #202020;
      --card-soft: #282828;
      --border: #3b3b3b;
      --text: #f0f0f0;
      --text-soft: #b8b8b8;
      --muted: #8c8c8c;
      --primary: #d8d8d8;
      --primary-strong: #a8a8a8;
      --primary-soft: #2a2a2a;
      --orange-soft: #2d2418;
      --orange-border: #523b1c;
      --orange-text: #f59e0b;
      --blue-soft: #1e293b;
      --blue-border: #334155;
      --blue-text: #38bdf8;
      background:
        radial-gradient(120% 85% at 12% -10%, rgba(120, 120, 120, 0.28), transparent 62%),
        radial-gradient(110% 75% at 100% 5%, rgba(255, 233, 203, 0.08), transparent 62%),
        linear-gradient(180deg, #0f0f0f 0%, #151515 58%, #1c1c1c 100%);
    }

    .top-left-controls {
      position: absolute;
      top: calc(10px + env(safe-area-inset-top));
      left: 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      z-index: 20;
    }

    .close-overlay {
      position: absolute;
      top: calc(10px + env(safe-area-inset-top));
      right: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.9);
      cursor: pointer;
      z-index: 20;
      box-shadow: 0 8px 16px rgba(15, 66, 109, 0.14);
    }

    .close-overlay::after {
      content: "✕";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 0.95rem;
      color: #587293;
      font-weight: 700;
    }

    .help-chip {
      display: inline-flex;
      align-items: center;
      height: 36px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid #d9e0ea;
      background: rgba(242, 245, 249, 0.96);
      color: #8a95a8;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      white-space: nowrap;
      box-shadow: 0 8px 16px rgba(49, 65, 89, 0.08);
      pointer-events: none;
      user-select: none;
    }

    .theme-toggle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.9);
      color: #587293;
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(15, 66, 109, 0.14);
      transition: transform 120ms ease, background-color 160ms ease, color 160ms ease;
    }

    .theme-toggle:active {
      transform: scale(0.96);
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .theme-toggle .moon-icon,
    body[data-theme="dark"] .theme-toggle .sun-icon {
      display: none;
    }

    body[data-theme="dark"] .theme-toggle .moon-icon {
      display: block;
    }

    body[data-theme="dark"] .close-overlay,
    body[data-theme="dark"] .theme-toggle {
      background: linear-gradient(180deg, #2b2b2b 0%, #202020 100%);
      color: #e1e1e1;
      border-color: #424242;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    body[data-theme="dark"] .help-chip {
      background: rgba(42, 42, 42, 0.96);
      color: #a8a8a8;
      border-color: #454545;
    }

    .app-shell {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .app-main {
      padding: calc(52px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100%;
      width: 100%;
    }

    /* Oblast 1: Hero Header */
    .sheet-hero {
      padding: 18px 16px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(130% 90% at 6% 2%, rgba(185, 217, 248, 0.55), transparent 62%),
        radial-gradient(90% 80% at 95% 0%, rgba(255, 223, 187, 0.6), transparent 62%),
        linear-gradient(155deg, #ffffff 0%, #f2f8ff 100%);
      border: 1px solid var(--border);
      border-radius: 22px;
      flex: 0 0 auto;
    }

    body[data-theme="dark"] .sheet-hero {
      background:
        radial-gradient(130% 90% at 6% 2%, rgba(120, 120, 120, 0.22), transparent 62%),
        radial-gradient(90% 80% at 95% 0%, rgba(255, 223, 187, 0.08), transparent 62%),
        linear-gradient(155deg, #242424 0%, #191919 100%);
    }

    .hero-title {
      font-size: 1.25rem;
      line-height: 1.25;
      color: #1f4c71;
      font-weight: 800;
    }

    .hero-title-small {
      font-size: 0.86em;
      font-weight: 700;
    }

    .hero-sub {
      margin-top: 6px;
      font-size: 0.78rem;
      color: var(--text-soft);
      font-weight: 600;
    }

    body[data-theme="dark"] .hero-title {
      color: #eeeeee;
    }

    /* Oblast 2: Info Pill */
    .info-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: #43698f;
      font-weight: 500;
      font-size: 0.7rem;
      font-style: italic;
      padding: 6px 12px;
      box-shadow: 0 4px 10px rgba(31, 84, 133, 0.06);
      flex: 0 0 auto;
    }

    body[data-theme="dark"] .info-pill {
      background: #242424;
      color: #d0d0d0;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
    }

    /* Oblast 3: Overview Grid */
    .overview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      flex: 0 0 auto;
    }

    .mini-card {
      border-radius: 14px;
      border: 1px solid #e1ecfb;
      padding: 6px 10px;
      background: linear-gradient(150deg, #ffffff 0%, #f6faff 100%);
      box-shadow: 0 6px 12px rgba(31, 84, 133, 0.06);
    }

    body[data-theme="dark"] .mini-card {
      background: linear-gradient(150deg, #232323 0%, #292929 100%);
      border-color: #3d3d3d;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
    }

    body[data-theme="dark"] .mini-card h3 {
      color: #eeeeee;
    }

    .mini-card h3 {
      color: #274a70;
      font-size: 0.8rem;
      margin-bottom: 2px;
    }

    .mini-card p {
      color: var(--text-soft);
      font-size: 0.68rem;
      line-height: 1.15;
    }

    /* Oblast 4: Hlavní karta s polem a tlačítky */
    .sheet-content {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      padding: 10px;
      box-shadow: 0 10px 20px rgba(27, 83, 132, 0.08);
      flex: 1 1 auto;
      min-height: 0;
    }

    body[data-theme="dark"] .sheet-content {
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.24);
    }

    .shine-border {
      position: relative;
      border-radius: 16px;
      padding: 1px;
      overflow: hidden;
      background: linear-gradient(120deg, rgba(143, 192, 231, 0.2), rgba(242, 154, 46, 0.26), rgba(143, 192, 231, 0.2));
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 75px;
    }

    .shine-border::before {
      content: "";
      position: absolute;
      inset: -120%;
      background: conic-gradient(from 0deg, transparent 0deg, transparent 80deg, rgba(255, 255, 255, 0.95) 115deg, rgba(143, 192, 231, 0.72) 145deg, transparent 185deg, transparent 360deg);
      animation: shineSpin 4.8s linear infinite;
    }

    textarea {
      width: 100%;
      height: 100%;
      background: var(--card-soft);
      border: 1px solid #d8e7fa;
      border-radius: 15px;
      color: #213a5b;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      padding: 10px 12px;
      font-size: 0.9rem;
      line-height: 1.35;
      resize: none;
      outline: none;
      position: relative;
      z-index: 1;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    textarea::placeholder {
      color: #8da1bf;
      font-weight: 500;
    }

    body[data-theme="dark"] textarea {
      color: #f0f0f0;
      border-color: #3b3b3b;
    }

    body[data-theme="dark"] textarea::placeholder {
      color: #8f8f8f;
    }

    textarea:focus {
      border-color: #8fc0e7;
      box-shadow: 0 0 0 3px rgba(143, 192, 231, 0.26);
    }

    .hidden-file-input {
      display: none;
    }

    /* Dolní ovládací lišta tlačítek */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 2px 0;
      flex: 0 0 auto;
    }

    .btn-rect {
      flex: 1;
      height: 46px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: #36587e;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(31, 84, 133, 0.06);
      transition: transform 120ms ease, filter 120ms ease, background-color 120ms ease;
    }

    .btn-file-yellow {
      background: var(--orange-soft);
      border-color: var(--orange-border);
      color: var(--orange-text);
    }

    .btn-save-blue {
      background: var(--blue-soft);
      border-color: var(--blue-border);
      color: var(--blue-text);
    }

    .btn-rect svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-circle-dominant {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid #216d9b;
      background: linear-gradient(170deg, #0f5d88, #0a4768);
      color: #f2f8ff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(14, 94, 137, 0.4);
      transition: transform 120ms ease, filter 120ms ease;
      flex: 0 0 auto;
      margin: 0 4px;
    }

    body[data-theme="dark"] .btn-circle-dominant {
      background: linear-gradient(180deg, #2d4658 0%, #253846 100%);
      border-color: #486a82;
      color: #eef8ff;
    }

    .btn-circle-dominant svg {
      width: 30px;
      height: 30px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-circle-dominant.rec {
      background: linear-gradient(165deg, #ca5b4a, #b34134);
      border-color: #de8f84;
      animation: pulse 1.1s ease-in-out infinite;
    }

    .btn-rect:active,
    .btn-circle-dominant:active {
      transform: scale(0.95);
      filter: brightness(0.95);
    }

    /* Dolní stavová lišta s decentním textem a semaforovým puntíkem */
    .bottom-status-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 0 0 auto;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 0;
      background: transparent;
      border: none;
      box-shadow: none;
      color: var(--text-soft);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
      width: fit-content;
    }

    .status-chip::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      transition: background-color 200ms ease;
    }

    /* Semaforová indikace barvy puntíku podle stavu */
    .status-chip.ready::before,
    .status-chip.success::before {
      background: #22c55e; /* Zelená */
    }

    .status-chip.busy::before {
      background: #0284c7; /* Modrá (pracuje / ukládá) */
    }

    .status-chip.recording::before {
      background: #f97316; /* Oranžová / Žlutá (nahrává) */
    }

    .status-chip.error::before {
      background: #ef4444; /* Červená (chyba) */
    }

    body[data-theme="dark"] .status-chip {
      background: transparent;
      color: #94a3b8;
      border: none;
      box-shadow: none;
    }

    body[data-theme="dark"] .status-chip.busy::before {
      background: #38bdf8;
    }

    .status-line {
      height: 4px;
      border-radius: 999px;
      background: #e6eefb;
      overflow: hidden;
      position: relative;
    }

    .status-line::after {
      content: "";
      display: block;
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: transparent;
      transition: width 220ms ease, background-color 220ms ease;
    }

    body[data-state="busy"] .status-line::after {
      width: 30%;
      animation: indeterminate 1.35s linear infinite;
    }

    body[data-state="recording"] .status-line::after {
      width: 70%;
      background: linear-gradient(90deg, #f2994a, #d7633f);
      animation: breathe 1.1s ease-in-out infinite;
    }

    body[data-state="success"] .status-line::after {
      width: 100%;
      background: linear-gradient(90deg, #5ccf8a, #2aa864);
    }

    body[data-state="error"] .status-line::after {
      width: 100%;
      background: linear-gradient(90deg, #eb8d8d, #d84f4f);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.74; }
    }

    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    @keyframes indeterminate {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(330%); }
    }

    @keyframes shineSpin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="top-left-controls">
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Přepnout tmavý režim">
        <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2"></path>
          <path d="M12 20v2"></path>
          <path d="M4.93 4.93l1.41 1.41"></path>
          <path d="M17.66 17.66l1.41 1.41"></path>
          <path d="M2 12h2"></path>
          <path d="M20 12h2"></path>
          <path d="M4.93 19.07l1.41-1.41"></path>
          <path d="M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a7 7 0 1 0 11 11z"></path>
        </svg>
      </button>
      <div class="help-chip" aria-disabled="true">Nápověda</div>
    </div>
    <div id="closeBtn" class="close-overlay" aria-label="Zavřít aplikaci"></div>

    <div class="app-main">
      <!-- Oblast 1: Hero Header -->
      <div class="sheet-hero">
        <div class="hero-title">SUCHLESS <span class="hero-title-small">Capture Studio</span></div>
        <div class="hero-sub">Rychle zachyť nápad dřív, než zmizí.</div>
      </div>

      <!-- Oblast 2: Info Pill -->
      <div class="info-pill">Pracuj s poznámkami, hlasem i soubory na jednom místě</div>

      <!-- Oblast 3: Overview Grid -->
      <div class="overview-grid" aria-hidden="true">
        <div class="mini-card">
          <h3>Poznámky</h3>
          <p>Rychlé textové zachycení myšlenek.</p>
        </div>
        <div class="mini-card">
          <h3>Hlas a média</h3>
          <p>Nahrávky, fotky a soubory během pár sekund.</p>
        </div>
      </div>

      <!-- Oblast 4: Hlavní karta s polem a tlačítky -->
      <div class="sheet-content">
        <div class="shine-border">
          <textarea id="txt" placeholder="Napiš nápad, úkol nebo stručnou poznámku..."></textarea>
        </div>

        <div class="controls-row">
          <button id="fileBtn" class="btn-rect btn-file-yellow" aria-label="Nahrát soubor">
            <svg viewBox="0 0 24 24">
              <path d="M12 16V5"></path>
              <path d="M8 9l4-4 4 4"></path>
              <path d="M4 16v3h16v-3"></path>
            </svg>
          </button>
          <input type="file" id="file" class="hidden-file-input" accept="*/*">

          <button id="recBtn" class="btn-circle-dominant" aria-label="Hlasová poznámka">
            <svg viewBox="0 0 24 24">
              <rect x="9" y="3" width="6" height="11" rx="3"></rect>
              <path d="M5 11a7 7 0 0 0 14 0"></path>
              <path d="M12 18v3"></path>
            </svg>
          </button>

          <button id="saveBtn" class="btn-rect btn-save-blue" aria-label="Uložit poznámku">
            <svg viewBox="0 0 24 24">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>

        <div class="bottom-status-container">
          <div id="statusChip" class="status-chip ready">Připraveno</div>
          <div class="status-line"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycby1wPlRee-lSHkxAD1DyFTHHRFg9_aXogjOpCyzEsb88SaY6XdJEdNNsWEwAc2ocew1DA/exec";
    const PWA_SECRET_TOKEN = "FordFocus.1816v";
    const THEME_KEY = "suchlessCaptureThemeV1";

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    const statusChipEl = document.getElementById('statusChip');
    const themeToggleEl = document.getElementById('themeToggle');
    const themeColorMetaEl = document.getElementById('themeColorMeta');
    const closeBtnEl = document.getElementById('closeBtn');
    const recBtnEl = document.getElementById('recBtn');
    const fileBtnEl = document.getElementById('fileBtn');
    const fileInputEl = document.getElementById('file');
    const saveBtnEl = document.getElementById('saveBtn');

    let isRec = false;
    let audioTimer = null, audioSeconds = 0;
    let mediaRecorder = null;
    let audioChunks = [];
    let micStream = null;
    let currentTheme = localStorage.getItem(THEME_KEY) || 'light';

    function applyTheme(theme) {
      currentTheme = theme === 'dark' ? 'dark' : 'light';
      document.body.setAttribute('data-theme', currentTheme);
      localStorage.setItem(THEME_KEY, currentTheme);
      themeToggleEl.setAttribute(
        'aria-label',
        currentTheme === 'dark' ? 'Přepnout světlý režim' : 'Přepnout tmavý režim'
      );
      themeColorMetaEl.setAttribute('content', currentTheme === 'dark' ? '#151515' : '#f5f8ff');
    }

    applyTheme(currentTheme);

    themeToggleEl.addEventListener('click', () => {
      applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    closeBtnEl.addEventListener('click', requestCloseApp);
    recBtnEl.addEventListener('click', toggleAudio);
    fileBtnEl.addEventListener('click', () => fileInputEl.click());
    fileInputEl.addEventListener('change', () => {
      if (fileInputEl.files.length > 0) {
        sendFile(fileInputEl.files[0]);
      }
    });

    saveBtnEl.addEventListener('click', sendText);

    function setStatus(msg, state = 'ready') {
      document.body.setAttribute('data-state', state);
      statusChipEl.className = `status-chip ${state}`;
      statusChipEl.innerText = msg;
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function getFormattedDateTime() {
      const now = new Date();
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      return `${day}_${month}_${year}_${hours}${minutes}${seconds}`;
    }

    async function sendPayload(payload) {
      const body = JSON.stringify(payload);
      const options = {
        method: 'POST',
        body: body
      };

      if (body.length < 64000) {
        options.keepalive = true;
      }

      return fetch(GAS_API_URL, options);
    }

    function onUploadSuccess(message) {
      setStatus(message || 'Uloženo', 'success');
      fileInputEl.value = '';

      setTimeout(() => {
        requestCloseApp();
      }, 900);
    }

    function requestCloseApp() {
      window.close();
      setTimeout(() => {
        if (document.hidden) return;
        if (window.history.length > 1) {
          window.history.back();
          return;
        }
        window.location.href = 'about:blank';
      }, 120);
    }

    function sendText() {
      const val = document.getElementById('txt').value.trim();
      if (!val) return;
      document.getElementById('txt').value = '';
      const blob = new Blob([val], { type: 'text/markdown' });
      const fileName = `text_${getFormattedDateTime()}.md`;
      postData(blob, fileName, 'text/markdown');
    }

    async function toggleAudio() {
      if (!isRec) {
        try {
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
            ? 'audio/webm;codecs=opus'
            : 'audio/webm';

          mediaRecorder = new MediaRecorder(micStream, { mimeType });
          audioChunks = [];

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            const webmBlob = new Blob(audioChunks, { type: mimeType });
            const fileName = `audio_${getFormattedDateTime()}.webm`;
            postData(webmBlob, fileName, mimeType);
          };

          mediaRecorder.start();
          isRec = true;
          audioSeconds = 0;
          recBtnEl.classList.add('rec');
          setStatus('Nahrávání 00:00', 'recording');

          audioTimer = setInterval(() => {
            audioSeconds++;
            const formatted = formatTime(audioSeconds);
            setStatus(`Nahrávání ${formatted}`, 'recording');
          }, 1000);
        } catch (err) {
          setStatus('Mikrofon nedostupný', 'error');
        }
      } else {
        isRec = false;
        clearInterval(audioTimer);
        mediaRecorder.stop();
        if (micStream) micStream.getTracks().forEach((t) => t.stop());
        recBtnEl.classList.remove('rec');
        setStatus('Zpracovávám...', 'busy');
      }
    }

    function sendFile(f) {
      if (!f) return;
      postData(f, f.name, f.type || 'application/octet-stream');
    }

    function postData(blob, fileName, mimeType) {
      const reader = new FileReader();
      reader.onloadend = function () {
        const base64 = reader.result.split(',')[1];
        const payload = {
          token: PWA_SECRET_TOKEN,
          base64,
          fileName,
          mimeType
        };

        onUploadSuccess('Uloženo');

        sendPayload(payload).catch((err) => {
          console.error("Chyba přenosu na pozadí:", err);
        });
      };
      reader.readAsDataURL(blob);
    }

    window.addEventListener('load', () => {
      setStatus('Připraveno', 'ready');
    });
  </script>
</body>
</html>
