<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <title>SUCHLESS Capture</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #000000; 
      color: #f8fafc; 
      height: 100dvh; 
      display: flex; 
      flex-direction: column; 
      justify-content: flex-end; 
      overflow: hidden; 
    }

    /* Horní zavírací zóna */
    .close-overlay {
      flex: 1;
      background: transparent;
      cursor: pointer;
    }

    /* Dolní skleněná karta */
    .glass-card {
      background: rgba(18, 18, 18, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px 20px 0 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.9);
    }

    .header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      font-size: 0.8rem; 
      font-weight: 800; 
      color: #38bdf8; 
      padding-bottom: 2px;
      letter-spacing: 0.5px;
    }

    textarea { 
      width: 100%; 
      height: 65px; 
      background: rgba(9, 9, 11, 0.8); 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      border-radius: 10px; 
      color: #ffffff; 
      padding: 10px; 
      font-size: 0.9rem; 
      resize: none; 
      outline: none; 
    }
    textarea:focus { border-color: #38bdf8; }

    .grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 8px; 
    }
    
    .btn { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 12px; 
      border: none; 
      border-radius: 10px; 
      font-size: 0.85rem; 
      font-weight: bold; 
      color: #ffffff; 
      cursor: pointer; 
    }
    .btn:active { opacity: 0.8; transform: scale(0.98); }
    .btn-send { background: #10b981; grid-column: span 2; }
    .btn-audio { background: #ef4444; }
    .btn-audio.rec { background: #dc2626; animation: pulse 1s infinite; }
    .btn-cam { background: #0284c7; }
    .btn-file { background: #d97706; grid-column: span 2; }
    
    #status { text-align: center; font-size: 0.75rem; color: #38bdf8; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <div class="close-overlay" onclick="window.close()"></div>

  <div class="glass-card">
    <div class="header">
      <span>SUCHLESS CAPTURE</span>
      <span id="status">Připraven</span>
    </div>

    <textarea id="txt" placeholder="Napiš nebo vlož text..."></textarea>
    <button class="btn btn-send" onclick="sendText()">✍️ Odeslat text</button>

    <div class="grid">
      <button id="recBtn" class="btn btn-audio" onclick="toggleAudio()">🎤 Audio</button>
      
      <button class="btn btn-cam" onclick="document.getElementById('cam').click()">📸 Foťák</button>
      <input type="file" id="cam" style="display:none" accept="image/*" capture="environment" onchange="sendCameraPhoto(this.files[0])">
      
      <button class="btn btn-file" onclick="document.getElementById('file').click()">📁 Přiložit soubor</button>
      <input type="file" id="file" style="display:none" onchange="sendFile(this.files[0])">
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycby1wPlRee-lSHkxAD1DyFTHHRFg9_aXogjOpCyzEsb88SaY6XdJEdNNsWEwAc2ocew1DA/exec";
    const PWA_SECRET_TOKEN = "FordFocus.1816v";

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    let mediaRecorder, audioChunks = [], isRec = false;
    let audioTimer = null, audioSeconds = 0;

    function setStatus(msg) { document.getElementById('status').innerText = msg; }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // Pomocná funkce pro časové razítko: DD_MM_RRRR_HHMMSS
    function getFormattedDateTime() {
      const now = new Date();
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      return `${day}_${month}_${year}_${hours}${minutes}${seconds}`;
    }

    // 1. ODESLÁNÍ TEXTU (.md)
    function sendText() {
      const val = document.getElementById('txt').value.trim();
      if (!val) return;
      setStatus("Ukládám text...");
      const blob = new Blob([val], { type: 'text/markdown' });
      const fileName = `text_${getFormattedDateTime()}.md`;
      postData(blob, fileName, 'text/markdown');
      document.getElementById('txt').value = '';
    }

    // 2. ODESLÁNÍ AUDIA (.m4a)
    async function toggleAudio() {
      const btn = document.getElementById('recBtn');
      if (!isRec) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          
          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: 'audio/m4a' });
            const fileName = `audio_${getFormattedDateTime()}.m4a`;
            postData(blob, fileName, 'audio/m4a');
          };

          mediaRecorder.start();
          isRec = true;
          audioSeconds = 0;
          btn.innerText = `⏹️ Stop (00:00)`;
          btn.classList.add('rec');
          setStatus("Nahrávám audio...");

          audioTimer = setInterval(() => {
            audioSeconds++;
            const formatted = formatTime(audioSeconds);
            btn.innerText = `⏹️ Stop (${formatted})`;
            setStatus(`Nahrávám... ${formatted}`);
          }, 1000);

        } catch (err) { 
          setStatus("Chyba mikrofónu"); 
        }
      } else {
        clearInterval(audioTimer);
        mediaRecorder.stop();
        isRec = false;
        btn.innerText = "🎤 Audio";
        btn.classList.remove('rec');
        setStatus("Ukládám audio...");
      }
    }

    // 3. ODESLÁNÍ FOTKY Z FOŤÁKU (.jpg)
    function sendCameraPhoto(f) {
      if (!f) return;
      setStatus("Ukládám fotku...");
      const fileName = `foto_${getFormattedDateTime()}.jpg`;
      postData(f, fileName, 'image/jpeg');
    }

    // 4. ODESLÁNÍ LIBOVOLNÉHO SOUBORU
    function sendFile(f) {
      if (!f) return;
      setStatus("Ukládám soubor...");
      const ext = f.name.includes('.') ? f.name.split('.').pop() : 'bin';
      const fileName = `soubor_${getFormattedDateTime()}.${ext}`;
      postData(f, fileName, f.type || 'application/octet-stream');
    }

    function postData(blob, fileName, mimeType) {
      const reader = new FileReader();
      reader.onloadend = function () {
        const base64 = reader.result.split(',')[1];
        fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify({ 
            token: PWA_SECRET_TOKEN,
            base64: base64, 
            fileName: fileName, 
            mimeType: mimeType 
          })
        })
        .then(res => res.json())
        .then(data => {
          setStatus(data.message);
          setTimeout(() => {
            setStatus("Připraven");
            window.close();
          }, 1000);
        })
        .catch(err => setStatus("Chyba odeslání"));
      };
      reader.readAsDataURL(blob);
    }
  </script>
</body>
</html>
