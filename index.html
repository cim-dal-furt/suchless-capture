<!DOCTYPE html>
<html lang="cs">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <meta name="theme-color" content="#0b1220">
 <link rel="manifest" href="manifest.json">
 <title>SUCHLESS Capture Studio</title>
 <style>
 :root {
 --bg-0: #070a16;
 --bg-1: #0c1330;
 --bg-2: #122a56;
 --surface: rgba(255, 255, 255, 0.1);
 --surface-soft: rgba(255, 255, 255, 0.08);
 --surface-strong: rgba(8, 17, 36, 0.5);
 --border: rgba(255, 255, 255, 0.24);
 --text: #edf4ff;
 --text-soft: #bdcdf0;
 --muted: #9eb2da;
 --primary: #67b0ff;
 --primary-strong: #3f8dff;
 --success: #22c55e;
 --danger: #ef4444;
 --warning: #f59e0b;
 }

 * { box-sizing: border-box; margin: 0; padding: 0; }

 body {
 font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
 background:
 radial-gradient(120% 95% at 10% 0%, rgba(73, 129, 255, 0.42), transparent 58%),
 radial-gradient(100% 75% at 90% 18%, rgba(14, 165, 233, 0.32), transparent 62%),
 linear-gradient(158deg, var(--bg-0), var(--bg-1) 58%, var(--bg-2));
 color: var(--text);
 height: 100dvh;
 display: flex;
 flex-direction: column;
 justify-content: flex-end;
 overflow: hidden;
 position: relative;
 }

 body::before {
 content: "";
 position: absolute;
 inset: -20% -15% 45% -15%;
 background:
 radial-gradient(circle at 25% 25%, rgba(147, 197, 253, 0.26), transparent 42%),
 radial-gradient(circle at 70% 40%, rgba(59, 130, 246, 0.24), transparent 48%),
 radial-gradient(circle at 50% 70%, rgba(125, 211, 252, 0.22), transparent 44%);
 filter: blur(16px);
 animation: drift 16s ease-in-out infinite;
 pointer-events: none;
 }

 .close-overlay {
 flex: 1;
 background: transparent;
 cursor: pointer;
 position: relative;
 }

 .close-overlay::after {
 content: "Zavřít";
 position: absolute;
 top: 14px;
 right: 14px;
 font-size: 0.7rem;
 color: rgba(214, 227, 255, 0.78);
 letter-spacing: 0.08em;
 text-transform: uppercase;
 }

 .sheet {
 background: linear-gradient(140deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.05));
 backdrop-filter: blur(24px) saturate(150%);
 -webkit-backdrop-filter: blur(24px) saturate(150%);
 border-top: 1px solid var(--border);
 border-radius: 30px 30px 0 0;
 box-shadow:
 0 -18px 44px rgba(2, 6, 23, 0.62),
 inset 0 1px 0 rgba(255, 255, 255, 0.22);
 overflow: hidden;
 width: min(100%, 520px);
 margin: 0 auto;
 }

 .sheet-hero {
 padding: 16px 16px 14px;
 position: relative;
 overflow: hidden;
 background:
 radial-gradient(circle at 0% 100%, rgba(56, 189, 248, 0.34), transparent 52%),
 radial-gradient(circle at 95% 0%, rgba(99, 102, 241, 0.34), transparent 58%),
 linear-gradient(155deg, rgba(11, 20, 42, 0.72), rgba(14, 35, 68, 0.5));
 }

 .sheet-hero::before,
 .sheet-hero::after {
 content: "";
 position: absolute;
 border-radius: 50%;
 filter: blur(18px);
 opacity: 0.54;
 animation: floatOrb 12s ease-in-out infinite;
 }

 .sheet-hero::before {
 width: 126px;
 height: 126px;
 background: rgba(125, 211, 252, 0.52);
 top: -46px;
 right: -36px;
 }

 .sheet-hero::after {
 width: 112px;
 height: 112px;
 background: rgba(79, 70, 229, 0.4);
 bottom: -58px;
 left: -24px;
 animation-delay: -4s;
 }

 .drag-handle {
 width: 42px;
 height: 4px;
 border-radius: 999px;
 background: rgba(191, 219, 254, 0.75);
 margin: 0 auto 12px;
 }

 .hero-main {
 display: flex;
 justify-content: space-between;
 align-items: center;
 gap: 10px;
 position: relative;
 z-index: 2;
 }

 .hero-title {
 font-size: 0.74rem;
 letter-spacing: 0.16em;
 text-transform: uppercase;
 color: #dbeafe;
 font-weight: 600;
 }

 .hero-sub {
 margin-top: 5px;
 font-size: 0.98rem;
 color: #eef5ff;
 font-weight: 700;
 }

 .hero-orb {
 position: relative;
 height: 108px;
 display: grid;
 place-items: center;
 margin: 10px 0 12px;
 }

 .hero-orb-core {
 width: 88px;
 height: 88px;
 border-radius: 50%;
 background:
 radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0.06) 40%, transparent 60%),
 radial-gradient(circle at 70% 70%, rgba(56, 189, 248, 0.5), rgba(59, 130, 246, 0.18));
 border: 1px solid rgba(255, 255, 255, 0.45);
 box-shadow:
 0 0 0 10px rgba(255, 255, 255, 0.05),
 0 0 35px rgba(96, 165, 250, 0.55),
 inset 0 -8px 16px rgba(2, 6, 23, 0.5);
 animation: glowPulse 4.2s ease-in-out infinite;
 position: relative;
 }

 .hero-orb-core::before,
 .hero-orb-core::after {
 content: "";
 position: absolute;
 inset: -8px;
 border-radius: 50%;
 border: 1px solid rgba(219, 234, 254, 0.42);
 opacity: 0.85;
 animation: spin 9s linear infinite;
 }

 .hero-orb-core::after {
 inset: -14px;
 border-color: rgba(147, 197, 253, 0.26);
 animation-direction: reverse;
 animation-duration: 13s;
 }

 .status-chip {
 display: inline-flex;
 align-items: center;
 padding: 8px 12px;
 border-radius: 999px;
 border: 1px solid rgba(255, 255, 255, 0.3);
 background: rgba(12, 27, 52, 0.45);
 color: #e3efff;
 font-size: 0.72rem;
 font-weight: 700;
 letter-spacing: 0.03em;
 white-space: nowrap;
 box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
 }

 .status-chip.ready { color: #bfdbfe; }
 .status-chip.busy { color: #dbeafe; }
 .status-chip.recording { color: #fecaca; border-color: rgba(239, 68, 68, 0.45); }
 .status-chip.queued { color: #fde68a; border-color: rgba(245, 158, 11, 0.45); }
 .status-chip.success { color: #bbf7d0; border-color: rgba(34, 197, 94, 0.45); }
 .status-chip.error { color: #fecaca; border-color: rgba(239, 68, 68, 0.45); }

 .status-line {
 margin-top: 2px;
 height: 4px;
 border-radius: 999px;
 background: rgba(14, 25, 48, 0.65);
 overflow: hidden;
 position: relative;
 }

 .status-line::after {
 content: "";
 display: block;
 height: 100%;
 width: 42%;
 border-radius: inherit;
 background: linear-gradient(90deg, rgba(103, 176, 255, 0.85), rgba(125, 211, 252, 1));
 transition: width 220ms ease, background-color 220ms ease;
 }

 body[data-state="busy"] .status-line::after {
 width: 30%;
 animation: indeterminate 1.35s linear infinite;
 }

 body[data-state="recording"] .status-line::after {
 width: 70%;
 background: linear-gradient(90deg, rgba(248, 113, 113, 0.8), rgba(239, 68, 68, 1));
 animation: breathe 1.1s ease-in-out infinite;
 }

 body[data-state="success"] .status-line::after {
 width: 100%;
 background: linear-gradient(90deg, rgba(74, 222, 128, 0.75), rgba(34, 197, 94, 0.95));
 }

 body[data-state="error"] .status-line::after {
 width: 100%;
 background: linear-gradient(90deg, rgba(248, 113, 113, 0.75), rgba(239, 68, 68, 0.95));
 }

 body[data-state="queued"] .status-line::after {
 width: 100%;
 background: linear-gradient(90deg, rgba(251, 191, 36, 0.75), rgba(245, 158, 11, 0.95));
 }

 .sheet-content {
 padding: 16px 16px calc(18px + env(safe-area-inset-bottom));
 display: flex;
 flex-direction: column;
 gap: 11px;
 background:
 linear-gradient(165deg, rgba(8, 17, 36, 0.26), rgba(8, 17, 36, 0.5));
 }

 textarea {
 width: 100%;
 min-height: 96px;
 background: rgba(255, 255, 255, 0.11);
 border: 1px solid rgba(255, 255, 255, 0.25);
 border-radius: 16px;
 color: var(--text);
 padding: 13px;
 font-size: 0.95rem;
 line-height: 1.4;
 resize: none;
 outline: none;
 transition: border-color 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
 box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
 }

 textarea::placeholder { color: #d2dfff; opacity: 0.72; }

 textarea:focus {
 border-color: rgba(191, 219, 254, 0.72);
 box-shadow:
 0 0 0 4px rgba(103, 176, 255, 0.23),
 inset 0 1px 0 rgba(255, 255, 255, 0.22);
 background: rgba(255, 255, 255, 0.14);
 }

 .btn {
 display: inline-flex;
 align-items: center;
 justify-content: center;
 gap: 8px;
 width: 100%;
 min-height: 46px;
 padding: 11px 12px;
 border-radius: 14px;
 border: 1px solid transparent;
 color: #ecf4ff;
 font-size: 0.87rem;
 font-weight: 600;
 letter-spacing: 0.015em;
 cursor: pointer;
 transition: transform 120ms ease, filter 120ms ease, border-color 120ms ease, background-color 120ms ease;
 box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
 }

 .btn .btn-icon {
 width: 16px;
 height: 16px;
 display: inline-flex;
 align-items: center;
 justify-content: center;
 color: currentColor;
 opacity: 0.95;
 flex: 0 0 auto;
 }

 .btn .btn-icon svg {
 width: 16px;
 height: 16px;
 stroke: currentColor;
 fill: none;
 stroke-width: 1.9;
 stroke-linecap: round;
 stroke-linejoin: round;
 }

 .btn:active {
 transform: scale(0.985);
 filter: brightness(0.96);
 }

 .btn-primary {
 background: linear-gradient(165deg, rgba(130, 189, 255, 0.58), rgba(71, 145, 255, 0.45));
 border-color: rgba(219, 234, 254, 0.48);
 color: #eff6ff;
 box-shadow:
 0 10px 24px rgba(37, 99, 235, 0.32),
 inset 0 1px 0 rgba(255, 255, 255, 0.35);
 }

 .btn-secondary {
 background: rgba(255, 255, 255, 0.11);
 border-color: rgba(191, 219, 254, 0.26);
 color: #dbeafe;
 }

 .btn-alert {
 background: rgba(248, 113, 113, 0.2);
 border-color: rgba(252, 165, 165, 0.45);
 color: #fee2e2;
 }

 .btn-neutral {
 background: rgba(255, 255, 255, 0.08);
 border-color: rgba(191, 219, 254, 0.24);
 }

 .btn.rec {
 background: rgba(220, 38, 38, 0.42);
 border-color: rgba(252, 165, 165, 0.7);
 animation: pulse 1.1s ease-in-out infinite;
 }

 .grid {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 8px;
 }

 .full {
 grid-column: span 2;
 }

 .meta-row {
 margin-top: 2px;
 display: flex;
 justify-content: space-between;
 align-items: center;
 gap: 10px;
 color: #d7e5ff;
 font-size: 0.76rem;
 }

 .toggle {
 display: inline-flex;
 align-items: center;
 gap: 8px;
 cursor: pointer;
 }

 .toggle input {
 accent-color: var(--primary);
 width: 15px;
 height: 15px;
 }

 #status {
 color: #e2ebff;
 font-size: 0.78rem;
 min-height: 18px;
 }

 #queueInfo {
 color: #c0d3f7;
 font-size: 0.76rem;
 }

 @keyframes pulse {
 0%, 100% { opacity: 1; }
 50% { opacity: 0.74; }
 }

 @keyframes breathe {
 0%, 100% { opacity: 1; }
 50% { opacity: 0.55; }
 }

 @keyframes indeterminate {
 0% { transform: translateX(-110%); }
 100% { transform: translateX(330%); }
 }

 @keyframes floatOrb {
 0%, 100% { transform: translate(0, 0); }
 50% { transform: translate(-10px, 6px); }
 }

 @keyframes drift {
 0%, 100% { transform: translate3d(0, 0, 0); }
 50% { transform: translate3d(-1.8%, 2.8%, 0); }
 }

 @keyframes glowPulse {
 0%, 100% { transform: scale(1); }
 50% { transform: scale(1.045); }
 }

 @keyframes spin {
 from { transform: rotate(0deg); }
 to { transform: rotate(360deg); }
 }

 @media (max-width: 390px) {
 .hero-sub {
 font-size: 0.9rem;
 }

 .hero-orb {
 height: 96px;
 }

 .hero-orb-core {
 width: 78px;
 height: 78px;
 }
 }
 </style>
</head>
<body>

 <div class="close-overlay" onclick="window.close()"></div>

 <div class="sheet">
 <div class="sheet-hero">
 <div class="drag-handle"></div>
 <div class="hero-main">
 <div>
 <div class="hero-title">SUCHLESS Capture Studio</div>
 <div class="hero-sub">Rychlé zachycení myšlenek</div>
 </div>
 <div id="statusChip" class="status-chip ready">Připraveno</div>
 </div>
 <div class="hero-orb">
 <div class="hero-orb-core"></div>
 </div>
 <div class="status-line"></div>
 </div>

 <div class="sheet-content">
 <textarea id="txt" placeholder="Napiš nápad, úkol nebo rychlou poznámku..."></textarea>

 <button class="btn btn-primary" onclick="sendText()">
 <span class="btn-icon" aria-hidden="true">
 <svg viewBox="0 0 24 24">
 <path d="M12 20h9"></path>
 <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path>
 </svg>
 </span>
 <span>Zapsat</span>
 </button>

 <div class="grid">
 <button id="recBtn" class="btn btn-alert" onclick="toggleAudio()">
 <span class="btn-icon" aria-hidden="true">
 <svg viewBox="0 0 24 24">
 <rect x="9" y="3" width="6" height="11" rx="3"></rect>
 <path d="M5 11a7 7 0 0 0 14 0"></path>
 <path d="M12 18v3"></path>
 </svg>
 </span>
 <span>Hlasová poznámka</span>
 </button>

 <button class="btn btn-secondary" onclick="document.getElementById('cam').click()">
 <span class="btn-icon" aria-hidden="true">
 <svg viewBox="0 0 24 24">
 <path d="M4 8h4l2-2h4l2 2h4v10H4z"></path>
 <circle cx="12" cy="13" r="3"></circle>
 </svg>
 </span>
 <span>Otevřít fotoaparát</span>
 </button>
 <input type="file" id="cam" style="display:none" accept="image/*" capture="environment" onchange="sendCameraPhoto(this.files[0])">

 <button class="btn btn-neutral full" onclick="document.getElementById('file').click()">
 <span class="btn-icon" aria-hidden="true">
 <svg viewBox="0 0 24 24">
 <path d="M12 16V5"></path>
 <path d="M8 9l4-4 4 4"></path>
 <path d="M4 16v3h16v-3"></path>
 </svg>
 </span>
 <span>Nahrát soubor</span>
 </button>
 <input type="file" id="file" style="display:none" accept="*/*" onchange="sendFile(this.files[0])">
 </div>

 <div class="meta-row">
 <label class="toggle">
 <input type="checkbox" id="closeAfterSend" checked>
 Zavřít po odeslání
 </label>
 <span id="queueInfo">Fronta: 0</span>
 </div>

 <div id="status">Připraveno</div>
 </div>
 </div>

 <script>
 const GAS_API_URL = "https://script.google.com/macros/s/AKfycby1wPlRee-lSHkxAD1DyFTHHRFg9_aXogjOpCyzEsb88SaY6XdJEdNNsWEw…;
 const PWA_SECRET_TOKEN = "FordFocus.1816v";
 const QUEUE_KEY = "suchlessCaptureQueueV1";
 const CLOSE_AFTER_SEND_KEY = "suchlessCloseAfterSendV1";

 if ('serviceWorker' in navigator) {
 navigator.serviceWorker.register('./sw.js');
 }

 const statusEl = document.getElementById('status');
 const statusChipEl = document.getElementById('statusChip');
 const queueInfoEl = document.getElementById('queueInfo');
 const closeAfterSendEl = document.getElementById('closeAfterSend');

 let isRec = false;
 let audioTimer = null, audioSeconds = 0;
 let mediaRecorder = null;
 let audioChunks = [];
 let micStream = null;
 let closeAfterSend = localStorage.getItem(CLOSE_AFTER_SEND_KEY) !== '0';

 closeAfterSendEl.checked = closeAfterSend;
 closeAfterSendEl.addEventListener('change', () => {
 closeAfterSend = closeAfterSendEl.checked;
 localStorage.setItem(CLOSE_AFTER_SEND_KEY, closeAfterSend ? '1' : '0');
 });

 function setStatus(msg, state = 'ready') {
 statusEl.innerText = msg;
 document.body.setAttribute('data-state', state);
 statusChipEl.className = `status-chip ${state}`;

 if (state === 'recording') statusChipEl.innerText = 'Nahrávání';
 if (state === 'busy') statusChipEl.innerText = 'Ukládám';
 if (state === 'queued') statusChipEl.innerText = 'Offline fronta';
 if (state === 'success') statusChipEl.innerText = 'Hotovo';
 if (state === 'error') statusChipEl.innerText = 'Chyba';
 if (state === 'ready') statusChipEl.innerText = 'Připraveno';
 }

 function getQueue() {
 try {
 return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
 } catch {
 return [];
 }
 }

 function setQueue(queue) {
 localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
 updateQueueInfo();
 }

 function updateQueueInfo() {
 const count = getQueue().length;
 queueInfoEl.innerText = `Fronta: ${count}`;
 }

 function enqueuePayload(payload) {
 const queue = getQueue();
 queue.push(payload);
 setQueue(queue);
 }

 function formatTime(sec) {
 const m = Math.floor(sec / 60).toString().padStart(2, '0');
 const s = (sec % 60).toString().padStart(2, '0');
 return `${m}:${s}`;
 }

 function getFormattedDateTime() {
 const now = new Date();
 const day = String(now.getDate()).padStart(2, '0');
 const month = String(now.getMonth() + 1).padStart(2, '0');
 const year = now.getFullYear();
 const hours = String(now.getHours()).padStart(2, '0');
 const minutes = String(now.getMinutes()).padStart(2, '0');
 const seconds = String(now.getSeconds()).padStart(2, '0');
 return `${day}_${month}_${year}_${hours}${minutes}${seconds}`;
 }

 async function sendPayload(payload) {
 const response = await fetch(GAS_API_URL, {
 method: 'POST',
 body: JSON.stringify(payload)
 });

 if (!response.ok) {
 throw new Error('Network response error');
 }

 return response.json();
 }

 async function flushQueue() {
 if (!navigator.onLine) {
 if (getQueue().length > 0) {
 setStatus('Offline režim - čekám na připojení', 'queued');
 }
 return;
 }

 const queue = getQueue();
 if (queue.length === 0) return;

 setStatus(`Synchronizuji frontu (${queue.length})...`, 'busy');
 let remaining = [...queue];
 let sentCount = 0;

 while (remaining.length > 0) {
 const nextPayload = remaining[0];
 try {
 await sendPayload(nextPayload);
 sentCount++;
 remaining.shift();
 setQueue(remaining);
 } catch {
 break;
 }
 }

 if (sentCount > 0) {
 setStatus(`Synchronizováno: ${sentCount}`, 'success');
 setTimeout(() => {
 if (!isRec) setStatus('Připraveno', 'ready');
 }, 1000);
 } else if (remaining.length > 0) {
 setStatus('Čekám na stabilní připojení', 'queued');
 }
 }

 function onUploadSuccess(message) {
 setStatus(message || 'Uloženo', 'success');
 setTimeout(() => {
 if (closeAfterSend) {
 window.close();
 return;
 }
 if (!isRec) setStatus('Připraveno', 'ready');
 }, 900);
 }

 function queueForLater(payload) {
 enqueuePayload(payload);
 setStatus('Bez připojení - uloženo do fronty', 'queued');
 }

 function sendText() {
 const val = document.getElementById('txt').value.trim();
 if (!val) return;
 setStatus('Ukládám poznámku...', 'busy');
 const blob = new Blob([val], { type: 'text/markdown' });
 const fileName = `text_${getFormattedDateTime()}.md`;
 postData(blob, fileName, 'text/markdown');
 document.getElementById('txt').value = '';
 }

 function setRecButtonLabel(text) {
 const btn = document.getElementById('recBtn');
 btn.innerHTML = `
 <span class="btn-icon" aria-hidden="true">
 <svg viewBox="0 0 24 24">
 <rect x="9" y="3" width="6" height="11" rx="3"></rect>
 <path d="M5 11a7 7 0 0 0 14 0"></path>
 <path d="M12 18v3"></path>
 </svg>
 </span>
 <span>${text}</span>
 `;
 }

 async function toggleAudio() {
 const btn = document.getElementById('recBtn');

 if (!isRec) {
 try {
 micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
 const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
 ? 'audio/webm;codecs=opus'
 : 'audio/webm';

 mediaRecorder = new MediaRecorder(micStream, { mimeType });
 audioChunks = [];

 mediaRecorder.ondataavailable = (e) => {
 if (e.data.size > 0) audioChunks.push(e.data);
 };

 mediaRecorder.onstop = () => {
 const webmBlob = new Blob(audioChunks, { type: mimeType });
 const fileName = `audio_${getFormattedDateTime()}.webm`;
 postData(webmBlob, fileName, mimeType);
 };

 mediaRecorder.start();
 isRec = true;
 audioSeconds = 0;
 setRecButtonLabel('Ukončit nahrávání (00:00)');
 btn.classList.add('rec');
 setStatus('Nahrávání • 00:00', 'recording');

 audioTimer = setInterval(() => {
 audioSeconds++;
 const formatted = formatTime(audioSeconds);
 setRecButtonLabel(`Ukončit nahrávání (${formatted})`);
 setStatus(`Nahrávání • ${formatted}`, 'recording');
 }, 1000);
 } catch (err) {
 setStatus('Mikrofon není dostupný', 'error');
 }
 } else {
 isRec = false;
 clearInterval(audioTimer);
 mediaRecorder.stop();
 if (micStream) micStream.getTracks().forEach((t) => t.stop());
 setRecButtonLabel('Hlasová poznámka');
 btn.classList.remove('rec');
 setStatus('Zpracovávám záznam...', 'busy');
 }
 }

 function sendCameraPhoto(f) {
 if (!f) return;
 setStatus('Nahrávám fotografii...', 'busy');
 const fileName = f.name ? f.name : `photo_${getFormattedDateTime()}.jpg`;
 postData(f, fileName, 'image/jpeg');
 }

 function sendFile(f) {
 if (!f) return;
 setStatus('Nahrávám soubor...', 'busy');
 postData(f, f.name, f.type || 'application/octet-stream');
 }

 function postData(blob, fileName, mimeType) {
 const reader = new FileReader();
 reader.onloadend = async function () {
 const base64 = reader.result.split(',')[1];
 const payload = {
 token: PWA_SECRET_TOKEN,
 base64,
 fileName,
 mimeType
 };

 try {
 const data = await sendPayload(payload);
 onUploadSuccess(data && data.message ? data.message : 'Uloženo');
 flushQueue();
 } catch {
 queueForLater(payload);
 }
 };
 reader.readAsDataURL(blob);
 }

 window.addEventListener('online', flushQueue);
 window.addEventListener('load', () => {
 updateQueueInfo();
 setStatus('Připraveno', 'ready');
 flushQueue();
 });
 </script>
</body>
</html>
