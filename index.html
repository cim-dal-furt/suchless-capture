<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <title>SUCHLESS Capture</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000000;
      color: #f8fafc;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
    }

    .close-overlay {
      flex: 1;
      background: transparent;
      cursor: pointer;
    }

    .glass-card {
      background: rgba(18, 18, 18, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px 20px 0 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.9);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 800;
      color: #38bdf8;
      padding-bottom: 2px;
      letter-spacing: 0.5px;
    }

    textarea {
      width: 100%;
      height: 65px;
      background: rgba(9, 9, 11, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #ffffff;
      padding: 10px;
      font-size: 0.9rem;
      resize: none;
      outline: none;
    }
    textarea:focus { border-color: #38bdf8; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #ffffff;
      cursor: pointer;
    }
    .btn:active { opacity: 0.8; transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; pointer-events: none; }
    .btn-send { background: #10b981; grid-column: span 2; }
    .btn-audio { background: #ef4444; }
    .btn-audio.rec { background: #dc2626; animation: pulse 1s infinite; }
    .btn-cam { background: #0284c7; }
    .btn-file { background: #d97706; grid-column: span 2; }

    #status { text-align: center; font-size: 0.75rem; color: #38bdf8; }
    #status.error { color: #f87171; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <div class="close-overlay" onclick="window.close()"></div>

  <div class="glass-card">
    <div class="header">
      <span>CAPTURE</span>
      <span id="status">Připraven</span>
    </div>

    <textarea id="txt" placeholder="Napiš nebo vlož text..."></textarea>
    <button id="sendBtn" class="btn btn-send" onclick="sendText()">✍️ Odeslat textovou poznámku</button>

    <div class="grid">
      <button id="recBtn" class="btn btn-audio" onclick="toggleAudio()">🎤 Audio</button>

      <button class="btn btn-cam" onclick="document.getElementById('cam').click()">📸 Fotoaparát</button>
      <input type="file" id="cam" style="display:none" accept="image/*" capture="environment" onchange="sendCameraPhoto(this.files[0])">

      <button class="btn btn-file" onclick="document.getElementById('file').click()">📁 Soubor</button>
      <input type="file" id="file" style="display:none" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,application/pdf,application/msword,text/plain" onchange="sendFile(this.files[0])">
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycby1wPlRee-lSHkxAD1DyFTHHRFg9_aXogjOpCyzEsb88SaY6XdJEdNNsWEwAc2ocew1DA/exec";
    const PWA_SECRET_TOKEN = "FordFocus.1816v";

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    let isRec = false;
    let audioTimer = null, audioSeconds = 0;
    let mediaRecorder = null;
    let audioChunks = [];
    let micStream = null;

    function setStatus(msg, isError) {
      const el = document.getElementById('status');
      el.innerText = msg;
      el.classList.toggle('error', !!isError);
    }

    function setBusy(busy) {
      document.getElementById('sendBtn').disabled = busy;
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function getFormattedDateTime() {
      const now = new Date();
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      return `${day}_${month}_${year}_${hours}${minutes}${seconds}`;
    }

    // ---------- CORS-SAFE PŘENOS: hidden form POST + JSONP status polling ----------

    function generateRequestId() {
      return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
    }

    function ensureHiddenIframe() {
      if (!document.getElementById('hidden_target_iframe')) {
        const iframe = document.createElement('iframe');
        iframe.name = 'hidden_target_iframe';
        iframe.id = 'hidden_target_iframe';
        iframe.style.display = 'none';
        document.body.appendChild(iframe);
      }
    }

    function submitViaHiddenForm(fields) {
      ensureHiddenIframe();
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = GAS_API_URL;
      form.target = 'hidden_target_iframe';
      form.style.display = 'none';

      Object.keys(fields).forEach(function (key) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = fields[key];
        form.appendChild(input);
      });

      document.body.appendChild(form);
      form.submit();
      setTimeout(function () { form.remove(); }, 2000);
    }

    function pollStatus(requestId, attemptsLeft, onResult) {
      if (attemptsLeft <= 0) {
        onResult({ success: false, message: 'Časový limit vypršel – zkontroluj Drive, ale zkus to znovu.' });
        return;
      }

      const callbackName = 'suchlessCb_' + requestId.replace(/[^a-zA-Z0-9]/g, '');
      let scriptTag = null;

      window[callbackName] = function (result) {
        delete window[callbackName];
        if (scriptTag && scriptTag.parentNode) scriptTag.remove();

        if (result && result.pending) {
          setTimeout(function () { pollStatus(requestId, attemptsLeft - 1, onResult); }, 600);
        } else {
          onResult(result);
        }
      };

      scriptTag = document.createElement('script');
      scriptTag.src = GAS_API_URL + '?action=status&requestId=' + encodeURIComponent(requestId) +
        '&callback=' + callbackName + '&_=' + Date.now();
      scriptTag.onerror = function () {
        delete window[callbackName];
        if (scriptTag.parentNode) scriptTag.remove();
        setTimeout(function () { pollStatus(requestId, attemptsLeft - 1, onResult); }, 600);
      };
      document.body.appendChild(scriptTag);
    }

    function postData(blob, fileName, mimeType, onDone) {
      const reader = new FileReader();
      reader.onloadend = function () {
        const base64 = reader.result.split(',')[1];
        const requestId = generateRequestId();

        setBusy(true);
        setStatus("Odesílám...", false);

        submitViaHiddenForm({
          token: PWA_SECRET_TOKEN,
          base64: base64,
          fileName: fileName,
          mimeType: mimeType,
          requestId: requestId
        });

        // Malá prodleva než server stihne zapsat cache, pak pollujeme (max ~10x600ms = 6s)
        setTimeout(function () {
          pollStatus(requestId, 10, function (result) {
            setBusy(false);
            const ok = !!(result && result.success);
            setStatus((result && result.message) || (ok ? "Uloženo" : "Chyba odeslání"), !ok);
            onDone && onDone(ok);

            if (ok) {
              setTimeout(function () {
                setStatus("Připraven", false);
                window.close();
              }, 1200);
            }
          });
        }, 400);
      };
      reader.readAsDataURL(blob);
    }

    // ---------- ODESÍLACÍ AKCE ----------

    // 1. ODESLÁNÍ TEXTU (.md) – textarea se maže AŽ PO potvrzeném úspěchu
    function sendText() {
      const val = document.getElementById('txt').value.trim();
      if (!val) return;
      const blob = new Blob([val], { type: 'text/markdown' });
      const fileName = `text_${getFormattedDateTime()}.md`;
      postData(blob, fileName, 'text/markdown', function (success) {
        if (success) {
          document.getElementById('txt').value = '';
        }
      });
    }

    // 2. NAHRÁVÁNÍ AUDIA (WebM)
    async function toggleAudio() {
      const btn = document.getElementById('recBtn');
      if (!isRec) {
        try {
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(micStream, { mimeType: 'audio/webm' });
          audioChunks = [];

          mediaRecorder.ondataavailable = e => {
            if (e.data.size > 0) audioChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            const webmBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const fileName = `audio_${getFormattedDateTime()}.webm`;
            postData(webmBlob, fileName, 'audio/webm');
          };

          mediaRecorder.start();
          isRec = true;
          audioSeconds = 0;
          btn.innerText = `⏹️ Stop (00:00)`;
          btn.classList.add('rec');
          setStatus("Nahrávám ...", false);

          audioTimer = setInterval(() => {
            audioSeconds++;
            const formatted = formatTime(audioSeconds);
            btn.innerText = `⏹️ Stop (${formatted})`;
            setStatus(`Nahrávám... ${formatted}`, false);
          }, 1000);

        } catch (err) {
          setStatus("Chyba mikrofonu", true);
        }
      } else {
        isRec = false;
        clearInterval(audioTimer);

        mediaRecorder.stop();
        if (micStream) micStream.getTracks().forEach(t => t.stop());

        btn.innerText = "🎤 Audio";
        btn.classList.remove('rec');
        setStatus("Ukládám záznam...", false);
      }
    }

    // 3. ODESLÁNÍ FOTKY Z FOŤÁKU (.jpg)
    function sendCameraPhoto(f) {
      if (!f) return;
      const fileName = `foto_${getFormattedDateTime()}.jpg`;
      postData(f, fileName, 'image/jpeg');
    }

    // 4. ODESLÁNÍ LIBOVOLNÉHO SOUBORU
    function sendFile(f) {
      if (!f) return;
      const ext = f.name.includes('.') ? f.name.split('.').pop() : 'bin';
      const fileName = `soubor_${getFormattedDateTime()}.${ext}`;
      postData(f, fileName, f.type || 'application/octet-stream');
    }
  </script>
</body>
</html>
